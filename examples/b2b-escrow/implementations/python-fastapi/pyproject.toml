[project]
name = "escrow-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.121.2", "uvicorn==0.38.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

type: entity
id: contract.product-procurement
category: evidence
kind: contract
label: 商品采购协议
contextRef: context.product-procurement
roleRefs:
  - role.buyer
  - role.seller
attributes:
  - name: signed_at
    label: 协议签署时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 客户与供应商形成采购协议的业务时间
  - name: quantity
    label: 采购数量
    valueType: int
    required: true
    keyData: true
    meaning: 协议约定的商品数量
  - name: total_minor_units
    label: 协议总金额
    valueType: int
    required: true
    keyData: true
    meaning: 协议约定的最小货币单位整数总金额

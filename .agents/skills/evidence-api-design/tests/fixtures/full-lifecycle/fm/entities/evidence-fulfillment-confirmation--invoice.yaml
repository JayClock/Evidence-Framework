type: entity
id: confirmation.invoice
category: evidence
kind: fulfillment_confirmation
label: 发票开具确认
contextRef: fulfillment.invoice
responsibleRoleRef: role.seller
attributes:
  - name: confirmed_at
    label: 开票确认时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 供应商形成开票确认结果的业务时间
  - name: invoice_number
    label: 发票号码
    valueType: string
    required: true
    keyData: true
    meaning: 供应商确认开具的发票号码
  - name: request_number
    label: 开票申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次开票申请的业务标识；补充证据与确认引用同一申请编号
notes: 基于已存在且与申请匹配的补充证据形成；invoice_number引用证据业务编号，request_number引用申请编号。

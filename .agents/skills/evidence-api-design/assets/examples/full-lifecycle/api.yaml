  journeys:
    - id: http.buyer-product
      actorRoleRef: role.buyer
      steps:
        - id: http.buyer-read
          capabilityRef: capability.read-product-as-buyer
          expectStatus: 200
          entry: 从已有采购业务交接取得商品标识；本例不推导新的列表接口
          inputs:
            - target: path
              name: productId
              source:
                kind: literal
                value: product-1
                reason: 明确给出的合成入口参数
        - id: http.buyer-revalidate
          capabilityRef: capability.read-product-as-buyer
          expectStatus: 304
          entry: 对同一入口执行条件读取，沿用前次表示的缓存验证标识
          inputs:
            - target: path
              name: productId
              source:
                kind: literal
                value: product-1
                reason: 同一合成入口参数
            - target: header
              name: If-None-Match
              source:
                kind: response_header
                stepRef: http.buyer-read
                name: ETag
    - id: http.seller-product
      actorRoleRef: role.seller
      steps:
        - id: http.seller-read
          capabilityRef: capability.read-product-as-seller
          expectStatus: 200
          entry: 供应商从已有业务交接取得商品标识；不是通过客户身份委托
          inputs:
            - target: path
              name: productId
              source:
                kind: literal
                value: product-1
                reason: 明确给出的合成入口参数
    - id: http.inquire-products
      actorRoleRef: role.buyer
      steps:
        - id: http.step-inquire-products
          capabilityRef: capability.inquire-products
          expectStatus: 201
          entry: 该角色通过已确认业务交接取得已有父实例、原始业务凭证及证据引用，按约定登记入口办理；外部证据须先存在。
          inputs:
            - target: body
              name: started_at

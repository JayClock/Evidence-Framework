schemaVersion: '4.0'
id: api.product-procurement
sources: []
decisions:
  - id: decision.api-identities
    category: identity
    statement: 集合业务实例使用独立定位ID，父实例下唯一的业务对象使用单例路径
    reasoning: 路径不重复编码可由业务父实例唯一确定的身份；具体凭证仍保留自身实例标识
  - id: decision.context-roots
    category: navigation
    statement: 合同前、合同和领域 Context 使用独立 URI 根
    reasoning: 跨 Context 使用超媒体链接，三个履约项沿采购协议根导航
resources:
  - id: resource.product-inquiry
    entityRef: rfp.product-inquiry
    segment: product-inquiries
    identity:
      kind: api_resource_id
      parameter: inquiryId
      decisionRef: decision.api-identities
    basis:
      fmRefs:
        - rfp.product-inquiry
      reasoning: 商品询价是合同前 Context 的根资源
    businessName: 商品询价
    shape: collection
  - id: resource.product-quotation
    entityRef: proposal.product-quotation
    segment: quotation
    parentRef: resource.product-inquiry
    parentBindingRef: binding.quotation-inquiry
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - proposal.product-quotation
        - rfp.product-inquiry
      reasoning: 商品报价属于指定询价
    businessName: 商品报价
    shape: singleton
    cardinality:
      relationshipRef: relation.inquiry-precedes-quotation
  - id: resource.product-procurement
    entityRef: contract.product-procurement
    segment: product-procurements
    identity:
      kind: api_resource_id
      parameter: procurementId
      decisionRef: decision.api-identities
    basis:
      fmRefs:
        - contract.product-procurement
      reasoning: 商品采购协议使用独立合同 Context URI 根
    businessName: 商品采购协议
    shape: collection
  - id: resource.payment
    entityRef: request.payment
    segment: payment
    parentRef: resource.product-procurement
    parentBindingRef: binding.payment-procurement
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - request.payment
        - contract.product-procurement
      reasoning: payment申请属于指定采购协议
    businessName: 货款支付申请
    shape: singleton
    cardinality:
      relationshipRef: relation.contract-precedes-payment-request
  - id: resource.payment-confirmation
    entityRef: confirmation.payment
    segment: confirmation
    parentRef: resource.payment
    parentBindingRef: binding.payment-result
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - confirmation.payment
        - request.payment
      reasoning: payment确认对应指定申请
    businessName: 货款支付确认
    shape: singleton
    cardinality:
      relationshipRef: relation.payment-request-precedes-confirmation
  - id: resource.invoicing
    entityRef: request.invoice
    segment: invoicing
    parentRef: resource.product-procurement
    parentBindingRef: binding.invoicing-procurement
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - request.invoice
        - contract.product-procurement
      reasoning: invoice申请属于指定采购协议
    businessName: 发票开具申请
    shape: singleton
    cardinality:
      relationshipRef: relation.contract-precedes-invoice-request
  - id: resource.invoice
    entityRef: evidence.invoice
    segment: invoice
    parentRef: resource.invoicing
    parentBindingRef: binding.invoice-invoicing
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - evidence.invoice
        - request.invoice
        - relation.invoice-request-precedes-evidence
      reasoning: 开票补充证据以request_number归属已有申请，创建时不需要确认ID；证据证明后续形成的确认
    businessName: 发票
    shape: singleton
    cardinality:
      relationshipRef: relation.invoice-request-precedes-evidence
  - id: resource.invoice-confirmation
    entityRef: confirmation.invoice
    segment: confirmation
    parentRef: resource.invoicing
    parentBindingRef: binding.invoicing-result
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - confirmation.invoice
        - request.invoice
      reasoning: invoice确认对应指定申请
    businessName: 发票开具确认
    shape: singleton
    cardinality:
      relationshipRef: relation.invoice-request-precedes-confirmation
  - id: resource.delivery
    entityRef: request.delivery
    segment: delivery
    parentRef: resource.product-procurement
    parentBindingRef: binding.delivery-procurement
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - request.delivery
        - contract.product-procurement
      reasoning: delivery申请属于指定采购协议
    businessName: 商品发货申请
    shape: singleton
    cardinality:
      relationshipRef: relation.contract-precedes-delivery-request
  - id: resource.delivery-note
    entityRef: evidence.delivery-note
    segment: delivery-note
    parentRef: resource.delivery
    parentBindingRef: binding.note-delivery
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - evidence.delivery-note
        - request.delivery
        - relation.delivery-request-precedes-evidence
      reasoning: 发货补充证据以request_number归属已有申请，创建时不需要确认ID；证据证明后续形成的确认
    businessName: 发货单
    shape: singleton
    cardinality:
      relationshipRef: relation.delivery-request-precedes-evidence
  - id: resource.delivery-confirmation
    entityRef: confirmation.delivery
    segment: confirmation
    parentRef: resource.delivery
    parentBindingRef: binding.delivery-result
    identity:
      kind: parent_scoped
    basis:
      fmRefs:
        - confirmation.delivery
        - request.delivery
      reasoning: delivery确认对应指定申请
    businessName: 商品发货确认
    shape: singleton
    cardinality:
      relationshipRef: relation.delivery-request-precedes-confirmation
  - id: resource.product
    entityRef: thing.product
    segment: products
    identity:
      kind: api_resource_id
      parameter: productId
      decisionRef: decision.api-identities
    basis:
      fmRefs:
        - thing.product
      reasoning: 商品目录使用独立领域 Context URI 根
    businessName: 商品
    shape: collection
bindings:
  - id: binding.caller-sourcing-customer
    kind: caller_role
    roleRef: role.buyer
    scopeResourceRef: resource.product-inquiry
    basis:
      fmRefs:
        - role.buyer
      reasoning: 客户只发起自己参与的商品询价
  - id: binding.caller-sourcing-supplier
    kind: caller_role
    roleRef: role.seller
    scopeResourceRef: resource.product-inquiry
    basis:
      fmRefs:
        - role.seller
      reasoning: 供应商只对指定询价报价
  - id: binding.caller-buyer
    kind: caller_role
    roleRef: role.buyer
    scopeResourceRef: resource.product-procurement
    basis:
      fmRefs:
        - role.buyer
      reasoning: 客户只操作自己参与的采购协议
  - id: binding.caller-seller
    kind: caller_role
    roleRef: role.seller
    scopeResourceRef: resource.product-procurement
    basis:
      fmRefs:
        - role.seller
      reasoning: 供应商只操作自己参与的采购协议
  - id: binding.buyer-product-read
    kind: caller_role
    roleRef: role.buyer
    scopeResourceRef: resource.product
    basis:
      fmRefs:
        - role.buyer
      reasoning: 客户读取指定商品
  - id: binding.seller-product-read
    kind: caller_role
    roleRef: role.seller
    scopeResourceRef: resource.product
    basis:
      fmRefs:
        - role.seller
      reasoning: 供应商读取指定商品
  - id: binding.quotation-inquiry
    kind: parent_child
    parentResourceRef: resource.product-inquiry
    childResourceRef: resource.product-quotation
    basis:
      fmRefs:
        - rfp.product-inquiry
        - proposal.product-quotation
      reasoning: 报价关联指定询价
  - id: binding.payment-procurement
    kind: parent_child
    parentResourceRef: resource.product-procurement
    childResourceRef: resource.payment
    basis:
      fmRefs:
        - contract.product-procurement
        - request.payment
      reasoning: payment申请关联指定采购协议
  - id: binding.payment-result
    kind: parent_child
    parentResourceRef: resource.payment
    childResourceRef: resource.payment-confirmation
    basis:
      fmRefs:
        - request.payment
        - confirmation.payment
      reasoning: payment确认关联指定申请
  - id: binding.invoicing-procurement
    kind: parent_child
    parentResourceRef: resource.product-procurement
    childResourceRef: resource.invoicing
    basis:
      fmRefs:
        - contract.product-procurement
        - request.invoice
      reasoning: invoice申请关联指定采购协议
  - id: binding.invoicing-result
    kind: parent_child
    parentResourceRef: resource.invoicing
    childResourceRef: resource.invoice-confirmation
    basis:
      fmRefs:
        - request.invoice
        - confirmation.invoice
      reasoning: invoice确认关联指定申请
  - id: binding.invoice-invoicing
    kind: parent_child
    parentResourceRef: resource.invoicing
    childResourceRef: resource.invoice
    basis:
      fmRefs:
        - evidence.invoice
        - request.invoice
        - relation.invoice-request-precedes-evidence
      reasoning: 开票补充证据以request_number归属已有申请，创建时不需要确认ID；证据证明后续形成的确认
  - id: binding.delivery-procurement
    kind: parent_child
    parentResourceRef: resource.product-procurement
    childResourceRef: resource.delivery
    basis:
      fmRefs:
        - contract.product-procurement
        - request.delivery
      reasoning: delivery申请关联指定采购协议
  - id: binding.delivery-result
    kind: parent_child
    parentResourceRef: resource.delivery
    childResourceRef: resource.delivery-confirmation
    basis:
      fmRefs:
        - request.delivery
        - confirmation.delivery
      reasoning: delivery确认关联指定申请
  - id: binding.note-delivery
    kind: parent_child
    parentResourceRef: resource.delivery
    childResourceRef: resource.delivery-note
    basis:
      fmRefs:
        - evidence.delivery-note
        - request.delivery
        - relation.delivery-request-precedes-evidence
      reasoning: 发货补充证据以request_number归属已有申请，创建时不需要确认ID；证据证明后续形成的确认
scenarios:
  - id: scenario.api-product-procurement
    sourceScenarioRef: scenario.product-procurement
    basis:
      fmRefs:
        - rfp.product-inquiry
        - proposal.product-quotation
        - contract.product-procurement
        - request.payment
        - role.payment-proof
        - confirmation.payment
        - request.invoice
        - evidence.invoice
        - confirmation.invoice
        - request.delivery
        - evidence.delivery-note
        - confirmation.delivery
      reasoning: 使用完整商品采购场景验证 API 映射
capabilities:
  - id: capability.inquire-products
    actorRoleRef: role.buyer
    resourceRef: resource.product-inquiry
    view: collection
    method: POST
    effect:
      kind: append_evidence
      targetRef: rfp.product-inquiry
    businessCapability: 发起商品询价
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-sourcing-customer
    basis:
      fmRefs:
        - rfp.product-inquiry
      reasoning: 客户追加商品询价凭证
  - id: capability.quote-products
    actorRoleRef: role.seller
    resourceRef: resource.product-quotation
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: proposal.product-quotation
    businessCapability: 提交商品报价
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-sourcing-supplier
      - binding.quotation-inquiry
    basis:
      fmRefs:
        - proposal.product-quotation
      reasoning: 供应商针对指定询价追加报价凭证
  - id: capability.register-procurement
    actorRoleRef: role.buyer
    resourceRef: resource.product-procurement
    view: collection
    method: POST
    effect:
      kind: append_evidence
      targetRef: contract.product-procurement
    businessCapability: 登记商品采购协议
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-buyer
    basis:
      fmRefs:
        - contract.product-procurement
      reasoning: 客户登记已经形成的商品采购协议
  - id: capability.request-payment
    actorRoleRef: role.seller
    resourceRef: resource.payment
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: request.payment
    businessCapability: 申请支付货款
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-seller
      - binding.payment-procurement
    basis:
      fmRefs:
        - request.payment
      reasoning: 针对指定采购协议追加申请支付货款凭证
  - id: capability.confirm-payment
    actorRoleRef: role.buyer
    resourceRef: resource.payment-confirmation
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: confirmation.payment
    businessCapability: 确认支付货款
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-buyer
      - binding.payment-result
    ruleBindings:
      - ruleRef: rule.payment-evidence-ready
        purpose: precondition
      - ruleRef: rule.payment-completed
        purpose: result
    basis:
      fmRefs:
        - confirmation.payment
        - role.payment-proof
        - relation.payment-confirmation-uses-proof
        - rule.payment-completed
      reasoning: 引用已扮演支付凭证角色的外部结果；核对申请、金额、结果编号及时间，角色无责任人且不提供写入接口
  - id: capability.request-invoice
    actorRoleRef: role.buyer
    resourceRef: resource.invoicing
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: request.invoice
    businessCapability: 申请开具发票
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-buyer
      - binding.invoicing-procurement
    basis:
      fmRefs:
        - request.invoice
      reasoning: 针对指定采购协议追加申请开具发票凭证
  - id: capability.issue-invoice
    actorRoleRef: role.seller
    resourceRef: resource.invoice
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: evidence.invoice
    businessCapability: 提交发票
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-seller
      - binding.invoice-invoicing
    basis:
      fmRefs:
        - evidence.invoice
        - request.invoice
      reasoning: 针对已有开票申请追加补充证据；校验request_number与路径申请一致；乙方销售经办本项，调用角色表达合同责任
  - id: capability.confirm-invoicing
    actorRoleRef: role.seller
    resourceRef: resource.invoice-confirmation
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: confirmation.invoice
    businessCapability: 确认开具发票
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-seller
      - binding.invoicing-result
    ruleBindings:
      - ruleRef: rule.invoice-evidence-ready
        purpose: precondition
      - ruleRef: rule.invoice-completed
        purpose: result
    basis:
      fmRefs:
        - confirmation.invoice
        - evidence.invoice
        - relation.invoice-evidence-precedes-confirmation
        - rule.invoice-completed
      reasoning: 引用已有发票号码与申请编号，检查证据属于路径申请且当前可见；满足前提才形成确认
  - id: capability.request-delivery
    actorRoleRef: role.buyer
    resourceRef: resource.delivery
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: request.delivery
    businessCapability: 申请商品发货
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-buyer
      - binding.delivery-procurement
    basis:
      fmRefs:
        - request.delivery
      reasoning: 针对指定采购协议追加申请商品发货凭证
  - id: capability.record-delivery-note
    actorRoleRef: role.seller
    resourceRef: resource.delivery-note
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: evidence.delivery-note
    businessCapability: 提交发货单
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-seller
      - binding.note-delivery
    basis:
      fmRefs:
        - evidence.delivery-note
        - request.delivery
      reasoning: 针对已有发货申请追加补充证据；校验request_number与路径申请一致；乙方销售经办本项，调用角色表达合同责任
  - id: capability.confirm-delivery
    actorRoleRef: role.seller
    resourceRef: resource.delivery-confirmation
    view: singleton
    method: POST
    effect:
      kind: append_evidence
      targetRef: confirmation.delivery
    businessCapability: 确认商品发货
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.caller-seller
      - binding.delivery-result
    ruleBindings:
      - ruleRef: rule.delivery-evidence-ready
        purpose: precondition
      - ruleRef: rule.delivery-completed
        purpose: result
    basis:
      fmRefs:
        - confirmation.delivery
        - evidence.delivery-note
        - relation.delivery-evidence-precedes-confirmation
        - rule.delivery-completed
      reasoning: 引用已有发货单号与申请编号，检查证据属于路径申请且当前可见；满足前提才形成确认
  - id: capability.read-product-as-buyer
    actorRoleRef: role.buyer
    resourceRef: resource.product
    view: item
    method: GET
    effect:
      kind: read
      targetRef: thing.product
    businessCapability: 客户查看商品
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.buyer-product-read
    basis:
      fmRefs:
        - thing.product
      reasoning: 客户查看采购协议涉及的商品
  - id: capability.read-product-as-seller
    actorRoleRef: role.seller
    resourceRef: resource.product
    view: item
    method: GET
    effect:
      kind: read
      targetRef: thing.product
    businessCapability: 供应商查看商品
    scenarioRefs:
      - scenario.api-product-procurement
    bindingRefs:
      - binding.seller-product-read
    basis:
      fmRefs:
        - thing.product
      reasoning: 供应商查看采购协议涉及的商品
representations:
  - id: representation.product-quotation
    resourceRef: resource.product-quotation
    view: singleton
    format: hal
    fields:
      - name: unitPriceMinorUnits
        fmAttributeRef: proposal.product-quotation#unit_price_minor_units
    links:
      - rel: create-procurement
        targetResourceRef: resource.product-procurement
        targetView: collection
        parameterBindings: []
        visibleToRoleRefs:
          - role.buyer
        capabilityRef: capability.register-procurement
    basis:
      fmRefs:
        - proposal.product-quotation
      reasoning: 报价通过超媒体链接进入采购协议 Context 根
journeys:
  - id: journey.product-procurement
    scenarioRef: scenario.api-product-procurement
    steps:
      - id: step.procurement-1
        sourceStepSequence: 1
        description: 甲方采购员发起商品询价
        mapping: capability
        capabilityRef: capability.inquire-products
        basis:
          fmRefs:
            - rfp.product-inquiry
          reasoning: 映射步骤：甲方采购员发起商品询价
      - id: step.procurement-2
        sourceStepSequence: 2
        description: 乙方销售提交商品报价
        mapping: capability
        capabilityRef: capability.quote-products
        basis:
          fmRefs:
            - proposal.product-quotation
          reasoning: 映射步骤：乙方销售提交商品报价
      - id: step.procurement-3
        sourceStepSequence: 3
        description: 甲方采购员登记采购协议
        mapping: capability
        capabilityRef: capability.register-procurement
        basis:
          fmRefs:
            - contract.product-procurement
          reasoning: 映射步骤：甲方采购员登记采购协议
      - id: step.procurement-4
        sourceStepSequence: 4
        description: 乙方销售申请支付
        mapping: capability
        capabilityRef: capability.request-payment
        basis:
          fmRefs:
            - request.payment
          reasoning: 映射步骤：乙方销售申请支付
      - id: step.procurement-5
        sourceStepSequence: 5
        mapping: external
        description: 外部签署微信支付服务协议
        basis:
          fmRefs:
            - contract.wechat-payment
          reasoning: 微信支付合同内的业务活动，不声明采购API或外部接入方式
      - id: step.procurement-6
        sourceStepSequence: 6
        mapping: external
        description: 外部发起微信支付申请
        basis:
          fmRefs:
            - request.wechat-payment
          reasoning: 微信支付合同内的业务活动，不声明采购API或外部接入方式
      - id: step.procurement-7
        sourceStepSequence: 7
        mapping: external
        description: 外部形成微信支付确认并扮演支付凭证
        basis:
          fmRefs:
            - confirmation.wechat-payment
          reasoning: 微信支付合同内的业务活动，不声明采购API或外部接入方式
      - id: step.procurement-8
        sourceStepSequence: 8
        description: 甲方采购员确认支付
        mapping: capability
        capabilityRef: capability.confirm-payment
        basis:
          fmRefs:
            - confirmation.payment
          reasoning: 映射步骤：甲方采购员确认支付
      - id: step.procurement-9
        sourceStepSequence: 9
        description: 甲方采购员申请开票
        mapping: capability
        capabilityRef: capability.request-invoice
        basis:
          fmRefs:
            - request.invoice
          reasoning: 映射步骤：甲方采购员申请开票
      - id: step.procurement-10
        sourceStepSequence: 10
        description: 乙方销售提交发票
        mapping: capability
        capabilityRef: capability.issue-invoice
        basis:
          fmRefs:
            - evidence.invoice

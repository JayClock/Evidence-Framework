type: entity
id: rfp.product-inquiry
category: evidence
kind: rfp
label: 商品询价
contextRef: context.product-sourcing
responsibleRoleRef: role.buyer
attributes:
  - name: started_at
    label: 询价开始时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 客户发出商品询价的业务时间
  - name: expired_at
    label: 询价截止时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 本次询价接收报价的业务截止时间
  - name: quantity
    label: 询价数量
    valueType: int
    required: true
    keyData: true
    meaning: 客户希望采购的商品数量

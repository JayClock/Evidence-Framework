type: entity
id: request.payment
category: evidence
kind: fulfillment_request
label: 支付申请
contextRef: fulfillment.payment
responsibleRoleRef: role.seller
attributes:
  - name: started_at
    label: 支付申请时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 供应商提出支付申请的业务时间
  - name: expired_at
    label: 支付截止时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 客户完成支付的业务截止时间
  - name: requested_minor_units
    label: 申请支付金额
    valueType: int
    required: true
    keyData: true
    meaning: 申请支付的最小货币单位整数金额
  - name: request_number
    label: 支付申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次支付申请的业务标识；补充证据与确认引用同一申请编号

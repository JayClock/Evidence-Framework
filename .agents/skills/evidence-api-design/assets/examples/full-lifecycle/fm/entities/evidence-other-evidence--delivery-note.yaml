type: entity
id: evidence.delivery-note
category: evidence
kind: other_evidence
label: 发货单
contextRef: fulfillment.delivery
responsibleRoleRef: role.seller
attributes:
  - name: created_at
    label: 发货单形成时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 乙方销售形成发货单的业务时间
  - name: delivery_note_number
    label: 发货单号
    valueType: string
    required: true
    keyData: true
    meaning: 发货单的业务编号
  - name: request_number
    label: 发货申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次发货申请的业务标识；补充证据与确认引用同一申请编号
  - name: delivery_address
    label: 发货凭证记录值
    valueType: string
    required: true
    keyData: true
    meaning: 直接记录的发货结果，用于核对申请要求
notes: 发货确认所需的补充证据，先于确认形成；归属指定申请，证明该申请对应的确认。

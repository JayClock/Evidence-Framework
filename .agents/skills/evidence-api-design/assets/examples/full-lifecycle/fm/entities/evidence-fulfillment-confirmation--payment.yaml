type: entity
id: confirmation.payment
category: evidence
kind: fulfillment_confirmation
label: 支付确认
contextRef: fulfillment.payment
responsibleRoleRef: role.buyer
attributes:
  - name: confirmed_at
    label: 支付确认时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 客户形成支付确认结果的业务时间
  - name: paid_minor_units
    label: 确认支付金额
    valueType: int
    required: true
    keyData: true
    meaning: 客户确认支付的最小货币单位整数金额
  - name: request_number
    label: 支付申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次支付申请的业务标识；补充证据与确认引用同一申请编号
  - name: payment_number
    label: 支付结果编号
    valueType: string
    required: true
    keyData: true
    meaning: 引用扮演支付凭证角色的实际外部支付结果编号
notes: 客户基于已存在且匹配本申请的外部支付结果形成确认；支付凭证角色无责任人。

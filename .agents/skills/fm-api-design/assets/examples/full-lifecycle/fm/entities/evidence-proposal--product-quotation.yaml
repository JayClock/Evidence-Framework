type: entity
id: proposal.product-quotation
category: evidence
kind: proposal
label: 商品报价
contextRef: context.product-sourcing
responsibleRoleRef: role.seller
attributes:
  - name: started_at
    label: 报价开始时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 供应商提出商品报价的业务时间
  - name: expired_at
    label: 报价截止时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 本次报价可被接受的业务截止时间
  - name: unit_price_minor_units
    label: 商品单价
    valueType: int
    required: true
    keyData: true
    meaning: 报价中的最小货币单位整数单价

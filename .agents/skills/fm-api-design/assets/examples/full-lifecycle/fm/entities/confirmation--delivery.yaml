type: entity
id: confirmation.delivery
category: evidence
kind: fulfillment_confirmation
label: 发货确认
contextRef: fulfillment.delivery
responsibleRoleRef: role.seller
attributes:
  - name: confirmed_at
    label: 发货确认时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 供应方形成发货确认结果的业务时间
  - name: tracking_number
    label: 物流单号
    valueType: string
    required: true
    keyData: true
    meaning: 供应方确认的物流单号
  - name: request_number
    label: 发货申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次发货申请的业务标识；补充证据与确认引用同一申请编号
  - name: delivery_note_number
    label: 发货单号
    valueType: string
    required: true
    keyData: true
    meaning: 引用本次确认所依据的补充证据业务编号
notes: 基于已存在且与申请匹配的补充证据形成；delivery_note_number引用证据业务编号，request_number引用申请编号。

type: entity
id: evidence.payment-voucher
category: evidence
kind: other_evidence
label: 支付凭证
contextRef: fulfillment.payment
responsibleRoleRef: role.buyer
attributes:
  - name: created_at
    label: 支付凭证形成时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 甲方采购员形成支付凭证的业务时间
  - name: voucher_number
    label: 支付凭证号
    valueType: string
    required: true
    keyData: true
    meaning: 支付凭证的业务编号
  - name: request_number
    label: 支付申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次支付申请的业务标识；补充证据与确认引用同一申请编号
  - name: paid_minor_units
    label: 支付凭证记录值
    valueType: int
    required: true
    keyData: true
    meaning: 直接记录的支付结果，用于核对申请要求
notes: 支付确认所需的补充证据，先于确认形成；归属指定申请，证明该申请对应的确认。

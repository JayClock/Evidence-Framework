type: entity
id: evidence.invoice
category: evidence
kind: other_evidence
label: 发票
contextRef: fulfillment.invoice
responsibleRoleRef: role.seller
attributes:
  - name: created_at
    label: 发票形成时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 乙方销售形成发票的业务时间
  - name: invoice_number
    label: 发票号码
    valueType: string
    required: true
    keyData: true
    meaning: 发票的业务号码
  - name: request_number
    label: 开票申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次开票申请的业务标识；补充证据与确认引用同一申请编号
  - name: invoice_title
    label: 开票凭证记录值
    valueType: string
    required: true
    keyData: true
    meaning: 直接记录的开票结果，用于核对申请要求
notes: 开票确认所需的补充证据，先于确认形成；归属指定申请，证明该申请对应的确认。

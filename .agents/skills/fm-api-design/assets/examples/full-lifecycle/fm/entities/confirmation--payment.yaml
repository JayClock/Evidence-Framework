type: entity
id: confirmation.payment
category: evidence
kind: fulfillment_confirmation
label: 支付确认
contextRef: fulfillment.payment
responsibleRoleRef: role.buyer
attributes:
  - name: confirmed_at
    label: 支付确认时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 采购方形成支付确认结果的业务时间
  - name: paid_minor_units
    label: 确认支付金额
    valueType: int
    required: true
    keyData: true
    meaning: 采购方确认支付的最小货币单位整数金额
  - name: request_number
    label: 支付申请编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次支付申请的业务标识；补充证据与确认引用同一申请编号
  - name: voucher_number
    label: 支付凭证号
    valueType: string
    required: true
    keyData: true
    meaning: 引用本次确认所依据的补充证据业务编号
notes: 基于已存在且与申请匹配的补充证据形成；voucher_number引用证据业务编号，request_number引用申请编号。

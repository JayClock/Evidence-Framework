type: entity
id: request.delivery
category: evidence
kind: fulfillment_request
label: 发货申请
contextRef: fulfillment.delivery
responsibleRoleRef: role.buyer
attributes:
  - name: started_at
    label: 发货申请时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 采购方提出发货申请的业务时间
  - name: expired_at
    label: 发货截止时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 供应方完成发货的业务截止时间
  - name: delivery_address
    label: 收货地址
    valueType: string
    required: true
    keyData: true
    meaning: 本次商品交付的地址

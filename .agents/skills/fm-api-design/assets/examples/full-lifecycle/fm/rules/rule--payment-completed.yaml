type: rule
id: rule.payment-completed
kind: completion
label: payment履约完成判断
contextRef: fulfillment.payment
bindings:
  request:
    ref: request.payment
  confirmations:
    ref: confirmation.payment
    cardinality: many
expression:
  confirmations.exists(c, c.confirmed_at >= request.started_at && c.confirmed_at
  <= request.expired_at)
resultType: bool

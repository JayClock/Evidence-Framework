type: rule
id: rule.delivery-evidence-ready
kind: precondition
label: 发货确认的证据前提
contextRef: fulfillment.delivery
bindings:
  request:
    ref: request.delivery
  proofs:
    ref: evidence.delivery-note
    cardinality: many
  now:
    type: timestamp
expression: proofs.exists(p, p.request_number == request.request_number
  && p.created_at <= now && p.delivery_address == request.delivery_address)
resultType: bool
notes: 形成目标前核对已存在、当前可见且属于本申请的补充证据；now是判断时刻，不用于生成凭证时间。

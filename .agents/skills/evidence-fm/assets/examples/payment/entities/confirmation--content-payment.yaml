type: entity
id: confirmation.content-payment
category: evidence
kind: fulfillment_confirmation
label: 内容产品付款确认
contextRef: fulfillment.content-payment
responsibleRoleRef: role.subscriber
attributes:
  - name: confirmed_at
    label: 确认时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 确定履约结果形成的时间
  - name: paid_minor_units
    label: 实付最小货币单位金额
    valueType: int
    required: true
    keyData: true
    meaning: 订阅者实际支付的最小货币单位整数金额
  - name: currency
    label: 币种
    valueType: string
    required: true
    keyData: true
    meaning: ISO 4217 币种代码

type: rule
id: rule.external-payment-completed
kind: completion
label: 完成外部支付完成判断
description: "存在至少一份与请求（request.external-payment）\
  关联的确认凭证（confirmation.external-payment）时，\
  判定履约（fulfillment.external-payment）完成。"
contextRef: fulfillment.external-payment
bindings:
  request:
    ref: request.external-payment
  confirmations:
    ref: confirmation.external-payment
    cardinality: many
expression: confirmations.size() > 0
resultType: bool

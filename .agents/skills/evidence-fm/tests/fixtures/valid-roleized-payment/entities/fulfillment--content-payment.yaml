type: entity
id: fulfillment.content-payment
category: context
kind: fulfillment
label: 支付内容产品费用
parentContextRef: context.content-subscription
contractRef: contract.content-subscription
requestRef: request.content-payment
requestInterval:
  startAttribute: started_at
  endAttribute: expired_at
confirmationRefs:
  - role.content-payment-confirmation
completionPolicy:
  mode: any
requestTrigger:
  kind: domain_event
  eventType: SubscriptionContractSigned
  actsForRoleRef: role.platform-subscription
confirmationTriggers:
  - confirmationRef: role.content-payment-confirmation
    trigger:
      kind: integration_event
      eventType: QualifiedPaymentConfirmed
      actsForRoleRef: role.subscriber
subjectRefs:
  - thing.content
breaches:
  - conditionRuleRef: rule.payment-expired
    outcome:
      kind: terminate_contract

type: entity
id: fulfillment.external-payment
category: context
kind: fulfillment
label: 完成外部支付
parentContextRef: context.external-payment
contractRef: contract.external-payment
requestRef: request.external-payment
requestInterval:
  startAttribute: started_at
  endAttribute: expired_at
confirmationRefs:
  - confirmation.external-payment
completionPolicy:
  mode: all
requestTrigger:
  kind: domain_event
  eventType: MobilePaymentRequested
  actsForRoleRef: role.external-payment-customer
confirmationTriggers:
  - confirmationRef: confirmation.external-payment
    trigger:
      kind: domain_event
      eventType: MobilePaymentConfirmed
      actsForRoleRef: role.external-payment-provider

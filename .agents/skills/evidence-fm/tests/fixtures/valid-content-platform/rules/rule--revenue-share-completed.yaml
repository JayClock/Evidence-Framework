type: rule
id: rule.revenue-share-completed
kind: completion
label: 支付创作者收入分成完成判断
description:
  "存在至少一份与请求（request.revenue-share）关联的确认凭证（confirmation.revenue-sha\
  re）时，判定履约（fulfillment.revenue-share）完成。"
contextRef: fulfillment.revenue-share
bindings:
  request:
    ref: request.revenue-share
  confirmations:
    ref: confirmation.revenue-share
    cardinality: many
expression: confirmations.size() > 0
resultType: bool

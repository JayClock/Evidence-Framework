contextRef: context.goal-setting-fulfillment
contractRef: contract.operations-performance
requestRef: request.goal-setting
requestInterval:
  startAttribute: start_at
  endAttribute: expired_at
confirmationRefs:
  - confirmation.goal-setting
completionPolicy:
  mode: all
requestTrigger:
  kind: domain_event
  eventType: GoalSettingRequested
  actsForRoleRef: role.operator
confirmationTriggers:

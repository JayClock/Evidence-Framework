type: rule
id: rule.payment-expired
kind: breach
label: 付款逾期
contextRef: context.content-payment-fulfillment
bindings:
  request:
    ref: request.content-payment
  paymentConfirmed:
    type: bool
  now:
    type: timestamp
expression: now > request.expired_at && !paymentConfirmed
resultType: bool

type: rule
id: rule.payment-request-amount
kind: derivation
label: 从合同派生请求支付金额
description:
  "读取订阅合同（contract.content-subscription）约定的最小货币单位价格，\
  并将其作为付款请求（request.content-payment）的金额。"
contextRef: fulfillment.content-payment
bindings:
  contract:
    ref: contract.content-subscription
expression: contract.price_minor_units
resultType: int
target:
  entityRef: request.content-payment
  attribute: requested_minor_units

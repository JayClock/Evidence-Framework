type: fulfillment
id: fulfillment.content-payment
label: 支付内容产品费用
contextRef: context.content-payment-fulfillment
contractRef: contract.content-subscription
requestRef: request.content-payment
requestInterval:
  startAttribute: start_at
  endAttribute: expired_at
confirmationRefs:
  - confirmation.content-payment
completionPolicy:
  mode: all
requestTrigger:
  kind: domain_event
  eventType: SubscriptionContractSigned
  actsForRoleRef: role.platform-subscription
confirmationTriggers:
  - confirmationRef: confirmation.content-payment
    trigger:
      kind: domain_event
      eventType: ContentPaymentConfirmed
      actsForRoleRef: role.subscriber
subjectRefs:
  - thing.content
breaches:
  - conditionRuleRef: rule.payment-expired
    outcome:
      kind: terminate_contract

---
type: entity
id: contract.content-subscription
category: evidence
kind: contract
label: 内容产品订阅合同
contextRef: context.content-subscription
roleRefs:
  - role.subscriber
  - role.platform-subscription
attributes:
  - name: signedAt
    label: 签约时间
    valueType: timestamp
    required: true
    keyData: true
    meaning: 双方合同成立时间
  - name: priceMinorUnits
    label: 合同价格最小货币单位金额
    valueType: int
    required: true
    keyData: true
    meaning: 合同确认的应付整数金额
  - name: currency
    label: 币种
    valueType: string
    required: true
    keyData: true
    meaning: 合同确认的 ISO 4217 币种代码

<!-- evidence-object-workbench -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-sa1uSIrd/lHKYtMjimGIcUlHloA9qtqK6ul4PSJEke0='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Evidence · 业务对象工作台</title>
    <style>
      :root {
  color-scheme: light;
  font-family:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  color: #24344b;
  background: #f5f7fa;
  font-size: 14px;
  --line: #e0e6ee;
  --blue: #245edb;
  --muted: #718096;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input {
  font: inherit;
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 11px;
  background: white;
  color: inherit;
}
button:hover {
  background: #eef3fe;
  border-color: #b7cbef;
}
button:disabled {
  cursor: default;
  opacity: 0.45;
}
button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 3px solid #91b2ff;
  outline-offset: 2px;
}
header {
  height: 68px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 30px;
  background: #132136;
  color: white;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  color: #8fbcff;
  background: transparent;
  font-size: 24px;
  font-weight: 750;
  padding: 0;
}
.brand span {
  color: white;
  font-size: 20px;
}
.brand:hover {
  background: transparent;
}
.header-title {
  border-left: 1px solid #415068;
  padding-left: 28px;
}
.header-title span {
  display: block;
  font-size: 9px;
  letter-spacing: 0.17em;
  color: #95a9c5;
  margin-top: 4px;
}
.offline {
  margin-left: auto;
  border: 1px solid #46556b;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
}
.layout {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  height: calc(100vh - 68px);
}
aside {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: #fff;
  min-height: 0;
}
.search-box {
  padding: 24px 18px 12px;
}
.search-box label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 10px;
}
kbd {
  font-size: 10px;
  color: var(--muted);
  font-weight: normal;
}
input {
  width: 100%;
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f8fafc;
}
.tree-tools {
  display: flex;
  padding: 0 18px 14px;
  gap: 5px;
  border-bottom: 1px solid var(--line);
}
.tree-tools button {
  border: 0;
  padding: 4px 6px;
  font-size: 11px;
  color: var(--muted);
}
#tree {
  flex: 1;
  overflow: auto;
  padding: 14px 12px;
}
.tree-group {
  margin: 0 0 16px;
}
.tree-group h2,
.tree-group > summary {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
}
summary {
  padding: 9px 5px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
details details {
  padding-left: 12px;
  border-left: 1px solid #edf0f5;
  margin-left: 8px;
}
.tree-item {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 8px;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 9px 10px;
  font-size: 12px;
  margin: 1px 0;
}
.tree-item span {
  flex: 1;
  overflow-wrap: anywhere;
}
.tree-item small {
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
}
.tree-item.attribute-result {
  flex-direction: column;
  gap: 3px;
}
.tree-item.attribute-result small {
  white-space: normal;
  overflow-wrap: anywhere;
}
.tree-item.selected {
  color: var(--blue);
  background: #eaf1ff;
  box-shadow: inset 3px 0 var(--blue);
}
.tree-count,
.aside-note {
  color: var(--muted);
  font-size: 11px;
  padding: 4px 18px;
  line-height: 1.8;
}
.aside-note {
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
main {
  min-width: 0;
  overflow: auto;
}
.navigation {
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 57px;
  padding: 10px 32px;
  border-bottom: 1px solid var(--line);
  background: #fff;
}
.navigation > button {
  flex-shrink: 0;
}
#breadcrumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  min-width: 0;
  font-size: 12px;
}
#breadcrumbs button {
  font-size: 12px;
  border: 0;
  padding: 3px;
}
#copy {
  margin-left: auto;
}
#notice {
  padding: 10px 32px;
  color: var(--muted);
  font-size: 11px;
  border-bottom: 1px solid var(--line);
  background: #fafbfd;
  overflow-wrap: anywhere;
}
#detail {
  max-width: 1320px;
  margin: auto;
  padding: 34px 42px 80px;
}
h1 {
  font-size: 29px;
  letter-spacing: -0.03em;
  margin: 10px 0;
}
h2 {
  font-size: 15px;
  margin: 0 0 18px;
}
h3 {
  font-size: 14px;
  margin: 12px 0;
}
p {
  line-height: 1.8;
}
.eyebrow {
  color: var(--blue);
  font-size: 10px;
  letter-spacing: 0.16em;
  font-weight: 650;
  margin: 0;
}
.identity {
  color: var(--muted);
  font-family: ui-monospace, monospace;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.intro {
  color: #53657e;
  max-width: 850px;
  margin-bottom: 26px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin: 30px 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
}
.stats > div {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 20px;
  border-right: 1px solid var(--line);
}
.stats > div:last-child {
  border: 0;
}
.stats strong {
  font-size: 28px;
  font-weight: 650;
}
.stats span {
  color: var(--muted);
  font-size: 11px;
}
.card {
  margin: 22px 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 24px;
  background: #fff;
  min-width: 0;
}
.graph-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0;
}
.graph-toolbar button,
.graph-toolbar select {
  padding: 7px 10px;
  font-size: 12px;
}
.graph-toolbar label,
.graph-zoom {
  font-size: 12px;
  color: var(--muted);
}
.graph-legend {
  margin: 12px 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
  background: #fafbfd;
}
.graph-legend > summary {
  padding: 12px 16px;
  color: #445b78;
  font-weight: 600;
}
.legend-body {
  padding: 0 16px 12px;
}
.legend-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 12px;
}
.legend-card {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
  min-width: 0;
  text-align: center;
}
.legend-card h4 {
  margin: 12px 0 5px;
  font-size: 12px;
}
.legend-card p,
.legend-note {
  color: #64768e;
  font-size: 12px;
  margin: 5px 0;
}
.legend-note {
  margin-top: 12px;
}
.legend-sample {
  min-height: 146px;
  padding-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.legend-symbol {
  position: relative;
  width: 100%;
  max-width: 210px;
  min-height: 108px;
  padding: 16px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1px solid var(--graph-stroke);
  background: var(--graph-fill);
  border-radius: 12px;
  overflow-wrap: anywhere;
}
.legend-symbol small {
  font-size: 10px;
  color: #53657e;
}
.legend-square {
  border-radius: 0;
}
.legend-square.graph-role {
  border-width: 2px;
}
.legend-responsibility {
  position: absolute;
  top: -14px;
  right: -4px;
  max-width: 70%;
  border: 1px solid #9b761d;
  border-radius: 5px;
  padding: 4px 9px;
  background: #fff0c7;
  color: #694600;
  font-size: 10px;
}
.legend-context {
  width: 100%;
  min-height: 94px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  border: 1.5px solid #8ba3c2;
  border-radius: 10px;
  background: #edf3fb;
  overflow-wrap: anywhere;
}
.legend-context-domain {
  background: #edf6f0;
  border-color: #8baa94;
}
.legend-context-fulfillment {
  background: #fff;
  border-color: #a9b7ca;
  border-style: dashed;
}
.legend-context .legend-context {
  min-height: 62px;
}
.legend-connection {
  display: flex;
  align-items: center;
  width: 100%;
}
.legend-endpoint {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  padding: 5px;
}
.legend-line {
  position: relative;
  flex: 0 0 42px;
  border-top: 2px solid #4b5e75;
}
.legend-line[data-dashed='true'] {
  border-top-style: dashed;
}
.legend-line[data-arrow='true']::after {
  content: '';
  position: absolute;
  right: -1px;
  top: -5px;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 7px solid #4b5e75;
}
.graph-viewport {
  max-width: 100%;
  height: 600px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f6f8fc;
}
.graph-viewport > svg {
  display: block;
  max-width: none;
}
.graph-boundary-frame {
  fill: #edf3fb;
  stroke: #8ba3c2;
  stroke-width: 1.5;
  pointer-events: all;
}
.graph-boundary-domain > .graph-boundary-frame {
  fill: #edf6f0;
  stroke: #8baa94;
}
.graph-boundary-fulfillment > .graph-boundary-frame {
  fill: #fff;
  fill-opacity: 0.6;
  stroke: #a9b7ca;
  stroke-dasharray: 6 4;
}
.graph-boundary-label {
  font-size: 16px;
  font-weight: 600;
  fill: #445b78;
  cursor: pointer;
}
.graph-boundary.highlight > .graph-boundary-frame {
  stroke: #6f91bb;
  stroke-width: 2.5;
}
.graph-boundary.graph-primary > .graph-boundary-frame {
  stroke: var(--blue);
  stroke-width: 3.5;
}
.graph-boundary.highlight > .graph-boundary-label {
  fill: var(--blue);
}
.graph-boundary.graph-dim > .graph-boundary-frame {
  fill-opacity: 0.3;
  stroke-opacity: 0.4;
}
.graph-boundary.graph-dim > .graph-boundary-label {
  opacity: 0.5;
}
.graph-time-field {
  font-size: 12px;
  fill: #53657e;
}
.graph-cardinality {
  font-size: 12px;
  fill: #324b68;
  paint-order: stroke;
  stroke: white;
  stroke-width: 3px;
}
.graph-node,
.graph-responsibility,
.graph-edge {
  cursor: pointer;
}
.graph-node rect {
  fill: var(--graph-fill, #fff);
  stroke: var(--graph-stroke, #b7c7dc);
}
.graph-evidence {
  --graph-fill: #fff1f5;
  --graph-stroke: #bd6b83;
}
.graph-role {
  --graph-fill: #fff8e8;
  --graph-stroke: #b79b56;
}
.graph-participant {
  --graph-fill: #eff8f1;
  --graph-stroke: #78a788;
}
.graph-type {
  font-size: 11px;
  fill: #556984;
}
.graph-node-label {
  font-size: 14px;
  font-weight: 600;
  fill: #23354d;
}
.graph-node.highlight rect,
.graph-responsibility.highlight rect {
  stroke: #678cba;
  stroke-width: 2.5;
}
.graph-node.graph-primary rect,
.graph-responsibility.graph-primary rect {
  stroke: var(--blue);
  stroke-width: 4;
}
.graph-node.graph-dim,
.graph-responsibility.graph-dim {
  opacity: 0.45;
}
.graph-responsibility rect {
  fill: #fff0c7;
  stroke: #9b761d;
}
.graph-responsibility text {
  font-size: 12px;
  fill: #694600;
}
.graph-evidence-role rect {
  stroke-width: 2;
}
.graph-toolbar select {
  max-width: 210px;
}
.graph-toolbar button:disabled {
  opacity: 0.5;
  cursor: default;
}
.graph-line {
  fill: none;
  stroke-width: 1.8;
}
.graph-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 12;
}
.graph-edge.graph-dim {
  opacity: 0.22;
}
.graph-edge.highlight .graph-line {
  stroke: var(--blue);
  stroke-width: 3;
}
.graph-selection {
  font-size: 12px;
  min-height: 3em;
  overflow-wrap: anywhere;
}
.graph-relation-list {
  border-top: 1px solid var(--line);
}
.graph-relation-list summary {
  font-size: 12px;
}
.badge {
  display: inline-block;
  padding: 4px 8px;
  color: #496891;
  background: #eef3fa;
  border-radius: 4px;
  font-size: 10px;
}
.badge.evidence {
  background: #ffedf1;
  color: #b43656;
}
.badge.role {
  background: #fff4db;
  color: #8d6200;
}
.badge.participant {
  background: #e9f4ec;
  color: #3d7553;
}
.object-link {
  color: var(--blue);
  padding: 6px 9px;
  background: #f7faff;
  border-color: #e2eaf8;
  text-align: left;
  overflow-wrap: anywhere;
  max-width: 100%;
  font-size: 12px;
}
.link-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.reference-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}
.reference-grid > section {
  min-width: 0;
}
.reference-row {
  padding: 10px 0;
  border-bottom: 1px solid #eff2f6;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
}
.reference-row small {
  color: var(--muted);
  font-size: 11px;
}
.table-wrap {
  max-width: 100%;
  overflow: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  background: #f7f9fc;
  color: #64768e;
  font-size: 11px;
  font-weight: 600;
}
th,
td {
  text-align: center;
  padding: 12px;
  border-bottom: 1px solid #edf0f5;
  vertical-align: middle;
  overflow-wrap: anywhere;
}
th .object-link,
td .object-link {
  text-align: center;
}
td {
  min-width: 80px;
  line-height: 1.7;
}
.attribute-name {
  display: block;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.field-computation {
  min-width: 280px;
  max-width: 400px;
}
.field-rule + .field-rule {
  margin-top: 16px;
}
.field-rule-description {
  margin: 8px 0;
}
.field-rule-details {
  margin-top: 10px;
}
.field-rule-details > summary {
  padding: 6px 0;
  color: var(--blue);
  font-size: 11px;
}
.field-rule pre {
  margin: 8px 0;
  padding: 10px;
}
.field-rule-inputs {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 11px;
}
.request-rule {
  padding: 14px;
  margin: 12px 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow-wrap: anywhere;
}
.request-rule-selected {
  background: #eaf1ff;
  outline: 2px solid var(--blue);
}
.request-rule-details > summary {
  color: var(--blue);
}
.request-outcome {
  margin-top: 20px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.attribute-selected {
  background: #eaf1ff;
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}
pre {
  padding: 18px;
  border: 1px solid var(--line);
  background: #f8fafc;
  border-radius: 5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font:
    12px/1.9 ui-monospace,
    monospace;
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
.missing {
  color: #92682a;
  background: #fff8e8;
  padding: 7px;
  font-size: 12px;
  overflow-wrap: anywhere;
}
[hidden] {
  display: none !important;
}
@media (max-width: 900px) {
  .layout {
    grid-template-columns: 245px minmax(0, 1fr);
  }
  #detail {
    padding: 25px 20px 60px;
  }
  .stats {
    grid-template-columns: repeat(3, 1fr);
  }
  .reference-grid {
    grid-template-columns: 1fr;
  }
  .navigation {
    padding: 10px 18px;
    gap: 8px;
  }
}
@media (max-width: 600px) {
  header {
    padding: 0 16px;
    gap: 14px;
  }
  .header-title {
    padding-left: 14px;
    font-size: 11px;
  }
  .offline {
    font-size: 9px;
  }
  .brand span {
    font-size: 16px;
  }
  .layout {
    display: block;
    height: auto;
  }
  aside {
    max-height: 330px;
    border-bottom: 1px solid var(--line);
  }
  .search-box {
    padding-top: 14px;
  }
  #tree {
    min-height: 100px;
  }
  .aside-note {
    display: none;
  }
  main {
    overflow: visible;
  }
  #detail {
    padding: 22px 14px 50px;
  }
  h1 {
    font-size: 24px;
  }
  .stats {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .stats > div {
    padding: 14px;
  }
  .card {
    padding: 16px;
  }
  #notice {
    padding: 10px 18px;
  }
}
;

  </head>
  <body>
    <header>
      <button id="home" class="brand" aria-label="返回模型概览">
        E<span>Evidence</span>
      </button>
      <div class="header-title">业务对象工作台 <span>MODEL EXPLORER</span></div>
      <span class="offline">离线 · 只读</span>
    </header>
    <div class="layout">
      <aside aria-label="模型导航">
        <div class="search-box">
          <label for="search">查找业务对象 <kbd>⌘ / Ctrl K</kbd></label
          ><input
            id="search"
            type="search"
            placeholder="名称、ID、规则或字段"
            autocomplete="off"
          />
        </div>
        <div class="tree-tools">
          <button id="expand">展开全部</button
          ><button id="collapse">折叠全部</button
          ><button id="reset">清除搜索</button>
        </div>
        <nav id="tree" aria-label="业务对象树"></nav>
        <p class="aside-note">
          模型描述业务，场景检验判断。<br />机器检查不等于业务批准。
        </p>
      </aside>
      <main id="main">
        <div class="navigation">
          <button id="back" disabled>← 返回</button>
          <nav id="breadcrumbs" aria-label="当前位置"></nav>
          <button id="copy" hidden>复制 ID</button>
        </div>
        <div id="notice" role="status">正在加载对象工作台…</div>
        <article id="detail" aria-live="polite"></article>
      </main>
    </div>

      crossBoundary,
      dashed: crossBoundary || e.kind === 'plays_role',
      arrow: e.kind === 'plays_role',
    });
  }
  const roleLinks = facts
    .filter(
      (e) =>
        e.label === '合同责任角色' && boxMap.has(e.from) && boxMap.has(e.to),
    )
    .map((e) => ({ ...e, detailRef: e.to }));
  const boxes = [...boxMap.values()];
  // Paint parents before children without making contexts relationship endpoints.
  const boundaries = [...boundaryMap.values()].sort(
    (a, b) => (a.kind === 'fulfillment') - (b.kind === 'fulfillment'),
  );
  return {
    boxes,
    boundaries,
    scopes,
    edges,
    roleLinks,
    relations,
    unresolved,
    warnings,

    width: Math.max(
      600,
      ...[...boxes, ...boundaries].map((b) => b.x + b.width + 90),
    ),
    height: Math.max(
      240,
      ...[...boxes, ...boundaries].map((b) => b.y + b.height + 60),
    ),
  };
}

function buildBusinessLegend(layout) {
  const items = [];
  const names = {
    'evidence.contract': ['合同凭证', '约定双方权责的凭证。'],
    'evidence.fulfillment_request': ['履约请求', '提出本次履约要求的凭证。'],
    'evidence.fulfillment_confirmation': [
      '履约确认',
      '记录实际履约结果的凭证。',
    ],
    'evidence.other_evidence': ['其他凭证', '记录业务事实的补充凭证。'],
    'participant.party': ['主体参与者', '在不同上下文中保持自身身份。'],
    'participant.thing': ['标的参与者', '业务涉及的对象或标的。'],
    'role.party': ['当事人角色', '参与者在当前上下文中承担的角色。'],
    'role.evidence': ['凭证角色', '由具体凭证扮演，不是另一份确认凭证。'],
  };
  for (const example of layout.boxes) {
    const key = `${example.group}.${example.kind}`;
    if (items.some((item) => item.key === key)) continue;
    const [label, description] = names[key] || [
      example.kind,
      '当前模型中已有的对象类型。',
    ];
    items.push({ key, section: 'objects', label, description, example });
  }
  const contexts = {
    domain: ['领域上下文', '划分领域对象的归属。'],
    contract: ['合同上下文', '划分合同权责范围，不是合同凭证节点。'],
    fulfillment: [
      '权责履约',
      '合约内的请求、完成证明及规则，不构成上下文边界。',
    ],
  };
  for (const example of layout.boundaries) {
    const key = `${example.group}.${example.kind}`;
    if (items.some((item) => item.key === key)) continue;
    const [label, description] = contexts[example.kind] || [
      '上下文',
      '对象的归属边界。',
    ];
    items.push({
      key,
      section: example.group === 'fulfillment' ? 'fulfillments' : 'contexts',
      label,
      description,
      example,
    });
  }
  const lines = [...layout.edges, ...layout.roleLinks];
  for (const [key, label, description, predicate] of [
    [
      'local',
      '同边界关联',
      '实线，无箭头；不表示执行顺序。',
      (e) => !e.arrow && !e.crossBoundary,
    ],
    [
      'cross',
      '跨边界关联',
      '虚线，无箭头；跨合同或领域边界。',
      (e) => !e.arrow && e.crossBoundary,
    ],
    [
      'plays_role',
      '角色扮演',
      '虚线箭头由具体玩家指向被扮演的角色。',
      (e) => e.arrow,
    ],
  ]) {
    const example = lines.find(predicate);
    if (example)
      items.push({
        key: `line.${key}`,
        section: 'lines',
        label,
        description,
        example,
      });
  }
  return items;
}

function graphTypeLabel(box) {
  return box.group === 'role' && box.kind === 'evidence'
    ? 'evidence role'
    : {
        fulfillment_request: 'request',
        fulfillment_confirmation: 'confirmation',
        other_evidence: 'evidence',
      }[box.kind] || box.kind;
}

function businessGraphEdgeKey(edge) {
  return edge.id || `responsibility:${JSON.stringify([edge.from, edge.to])}`;
}

// Highlight only relationships drawn on this canvas; never infer extra links.
function businessGraphHighlight(layout, target) {
  const result = {
    active: false,
    nodes: new Set(),
    edges: new Set(),
    boundaries: new Set(),
    primaryNode: '',
    primaryBoundary: '',
  };
  if (!target) return result;
  const index = new Map(
    [...layout.boxes, ...layout.boundaries].map((n) => [n.id, n]),
  );
  const boundaryIds = new Set(layout.boundaries.map((n) => n.id));
  const lines = [...layout.edges, ...layout.roleLinks];
  function belongs(id, context) {
    const seen = new Set();
    let node = index.get(id);
    while (node && !seen.has(node.id)) {
      if (node.id === context) return true;
      seen.add(node.id);
      node = index.get(node.parent);
    }
    return false;
  }
  function owners(id) {
    const seen = new Set([id]);
    let parent = index.get(id)?.parent;
    while (parent && !seen.has(parent)) {
      seen.add(parent);
      if (boundaryIds.has(parent)) result.boundaries.add(parent);
      parent = index.get(parent)?.parent;
    }
  }
  if (target.type === 'boundary' && boundaryIds.has(target.id)) {
    result.active = true;
    result.primaryBoundary = target.id;
    layout.boxes
      .filter((n) => belongs(n.id, target.id))
      .forEach((n) => result.nodes.add(n.id));
    layout.boundaries
      .filter((n) => belongs(n.id, target.id))
      .forEach((n) => result.boundaries.add(n.id));
    lines
      .filter((e) => result.nodes.has(e.from) && result.nodes.has(e.to))
      .forEach((e) => result.edges.add(businessGraphEdgeKey(e)));
  } else if (
    target.type === 'node' &&
    layout.boxes.some((n) => n.id === target.id)
  ) {
    result.active = true;
    result.primaryNode = target.id;
    result.nodes.add(target.id);
    owners(target.id);
    for (const edge of lines)
      if (edge.from === target.id || edge.to === target.id) {
        result.edges.add(businessGraphEdgeKey(edge));
        result.nodes.add(edge.from);
        result.nodes.add(edge.to);
      }
  } else if (target.type === 'edge') {
    const edge = lines.find((e) => businessGraphEdgeKey(e) === target.id);
    if (edge) {
      result.active = true;
      result.edges.add(target.id);
      for (const id of [edge.from, edge.to]) {
        result.nodes.add(id);
        owners(id);
      }
    }
  }
  return result;
}

const businessGraphState = {
  mode: 'simple',
  zoom: null,
  left: 0,
  top: 0,
};

function renderBusinessGraph(target) {
  const section = card('业务模型图', target);
  section.id = 'business-graph';

  const toolbar = el('div', '', 'graph-toolbar'),
    viewport = el('div', '', 'graph-viewport');
  viewport.tabIndex = 0;
  viewport.setAttribute('aria-label', '业务模型画布，可滚动查看');
  const selection = el('p', '', 'graph-selection');
  selection.setAttribute('aria-live', 'polite');
  const relationDetails = el('details', '', 'graph-relation-list');
  let layout, svg;
  const zoomLabel = el('span', '', 'graph-zoom');
  function choice(id, label, values, value, onChange) {
    const wrap = el('label', `${label} `),
      input = el('select');
    input.id = id;
    input.setAttribute('aria-label', label);
    values.forEach(([key, text]) => {
      const option = el('option', text);
      option.value = key;
      input.append(option);
    });
    input.value = value;
    input.addEventListener('change', () => onChange(input.value));
    wrap.append(input);
    toolbar.append(wrap);
    return input;
  }
  function control(id, label, run) {
    const button = action(label, run);
    button.id = id;
    toolbar.append(button);
    return button;
  }

  choice(
    'graph-mode',
    '显示模式',
    [
      ['simple', '简化图'],
      ['standard', '标准图'],
    ],
    businessGraphState.mode,
    (value) => {
      businessGraphState.mode = value;
      draw();
    },
  );

  function setZoom(value) {
    businessGraphState.zoom = Math.max(0.2, Math.min(2, value));
    svg.setAttribute('width', layout.width * businessGraphState.zoom);
    svg.setAttribute('height', layout.height * businessGraphState.zoom);
    zoomLabel.textContent = `${Math.round(businessGraphState.zoom * 100)}%`;
  }
  control('graph-zoom-out', '− 缩小', () =>
    setZoom(businessGraphState.zoom / 1.25),
  );
  control('graph-zoom-in', '+ 放大', () =>
    setZoom(businessGraphState.zoom * 1.25),
  );
  toolbar.append(zoomLabel);
  control('graph-fit', '适合宽度', () => {
    setZoom(Math.min(1, (viewport.clientWidth - 4) / layout.width));
    viewport.scrollTo(0, 0);
  });
  control('graph-actual', '原始大小', () => setZoom(1));
  const legend = el('details', '', 'graph-legend');
  const legendBody = el('div', '', 'legend-body');
  legend.append(el('summary', '图例 · 对象、上下文与连线'), legendBody);
  relationDetails.append(el('summary', '查看关系详情'), selection);
  section.append(toolbar, legend, viewport, relationDetails);
  viewport.addEventListener('scroll', () => {
    businessGraphState.left = viewport.scrollLeft;
    businessGraphState.top = viewport.scrollTop;
  });
  function element(tag, attributes = {}, text = '') {
    const item = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attributes).forEach(([key, value]) =>
      item.setAttribute(key, value),
    );
    if (text) item.textContent = text;
    return item;
  }
  function interactive(item, label, run) {
    item.setAttribute('tabindex', '0');
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', label);
    item.addEventListener('click', run);
    item.addEventListener('keydown', (event) => {
      if (['Enter', ' '].includes(event.key)) {
        event.preventDefault();
        run();
      }
    });
  }
  function textLines(parent, value, x, y, cls, limit = 13) {
    const chars = Array.from(value);
    const text = element('text', { x, y, class: cls, 'text-anchor': 'middle' });
    for (let i = 0; i < Math.min(chars.length, limit * 2); i += limit)
      text.append(
        element(
          'tspan',
          { x, dy: i ? 19 : 0 },
          chars.slice(i, i + limit).join('') +
            (i === limit && chars.length > limit * 2 ? '…' : ''),
        ),
      );
    parent.append(text);
    return text.childElementCount;
  }
  function drawLegend() {
    legendBody.replaceChildren();
    const items = buildBusinessLegend(layout);
    if (!items.length) {
      legendBody.append(el('p', '当前没有可展示的图形。', 'muted'));
      return;
    }
    for (const [sectionKey, heading] of [
      ['objects', '业务对象'],
      ['contexts', '上下文边界'],
      ['fulfillments', '权责履约'],
      ['lines', '关系连线'],
    ]) {
      const selected = items.filter((item) => item.section === sectionKey);
      if (!selected.length) continue;
      const group = el('section', '', 'legend-group'),
        grid = el('div', '', 'legend-grid');
      group.append(el('h3', heading), grid);
      for (const item of selected) {
        const card = el('div', '', 'legend-card'),
          sample = el('div', '', 'legend-sample');
        const example = item.example;
        card.dataset.legendKind = item.key;
        card.dataset.legendExample = example.id || example.from;
        if (sectionKey === 'objects') {
          const square =
            example.group === 'evidence' ||
            (example.group === 'role' && example.kind === 'evidence');
          const symbol = el(
            'div',
            '',
            `legend-symbol graph-${example.group}${square ? ' legend-square' : ''}`,
          );
          symbol.append(
            el('small', `<${graphTypeLabel(example)}>`),
            el('strong', example.label),
          );
          example.timeFields.forEach((name) =>
            symbol.append(el('small', name)),
          );
          if (example.responsibleRef) {
            const badge = el(
              'span',
              title(example.responsibleRef),
              'legend-responsibility',
            );
            badge.dataset.legendRole = example.responsibleRef;
            symbol.append(badge);
          }
          sample.append(symbol);
        } else if (sectionKey === 'contexts' || sectionKey === 'fulfillments') {
          const frame = el(
            'div',
            example.label,
            `legend-context legend-context-${example.kind}`,
          );
          if (
            example.kind === 'fulfillment' &&
            nodes.get(example.parent)?.group === 'context'
          ) {
            const parent = el(
              'div',
              '',
              `legend-context legend-context-${nodes.get(example.parent).kind}`,
            );
            parent.append(el('small', title(example.parent)), frame);
            sample.append(parent);
          } else sample.append(frame);
        } else {
          const connection = el('div', '', 'legend-connection'),
            line = el('span', '', 'legend-line');
          line.dataset.dashed = String(Boolean(example.dashed));
          line.dataset.arrow = String(Boolean(example.arrow));
          line.setAttribute('aria-hidden', 'true');
          card.dataset.legendFrom = example.from;
          card.dataset.legendTo = example.to;
          connection.append(
            el('span', title(example.from), 'legend-endpoint'),
            line,
            el('span', title(example.to), 'legend-endpoint'),
          );
          sample.append(connection);
        }
        card.append(sample, el('h4', item.label), el('p', item.description));
        grid.append(card);
      }
      legendBody.append(group);
    }
    if (layout.boxes.some((box) => box.responsibleRef))
      legendBody.append(
        el(
          'p',
          '右上角角标表示凭证责任方，只取模型已声明的角色；凭证角色不加责任角标。',
          'legend-note',
        ),
      );
    legendBody.append(
      el(
        'p',
        '示例取自当前模型。标准图补充已有类型、业务时间与关系基数；未声明的内容不补画。',
        'legend-note',
      ),
    );
  }
  function draw() {
    layout = buildBusinessGraph(DATA, businessGraphState);
    drawLegend();
    viewport.replaceChildren();
    svg = element('svg', {
      viewBox: `0 0 ${layout.width} ${layout.height}`,
      role: 'group',
      'aria-label': '业务模型图',
    });
    const entries = [];
    let hovered = null,
      focused = null;
    function paintHighlight() {
      const active = focused || hovered;
      const state = businessGraphHighlight(layout, active?.target);
      for (const entry of entries) {
        const { item, target: ref } = entry;
        let related = false,
          primary = false;
        if (ref.type === 'boundary') {
          related = state.boundaries.has(ref.id);
          primary = state.primaryBoundary === ref.id;
        } else if (ref.type === 'edge') related = state.edges.has(ref.id);
        else if (entry.badgeOwner) {
          related =
            state.nodes.has(entry.badgeOwner) || state.primaryNode === ref.id;
          primary = state.primaryNode === ref.id;
        } else {
          related = state.nodes.has(ref.id);
          primary = state.primaryNode === ref.id;
        }
        item.classList.toggle('highlight', state.active && related);
        item.classList.toggle('graph-primary', state.active && primary);
        item.classList.toggle('graph-dim', state.active && !related);
      }
      if (state.active) {
        svg.dataset.highlightType = active.target.type;
        svg.dataset.highlightId = active.target.id;
      } else {
        delete svg.dataset.highlightType;
        delete svg.dataset.highlightId;
      }
      selection.textContent = state.active
        ? active.description
        : layout.warnings.join('；');
    }
    function bindHighlight(
      item,
      target,
      description,
      focusItem = item,
      badgeOwner = '',
    ) {
      const entry = { item, target, description, badgeOwner };
      entries.push(entry);
      item.addEventListener('mouseenter', () => {
        hovered = entry;
        paintHighlight();
      });
      item.addEventListener('mouseleave', () => {
        if (hovered === entry) hovered = null;
        paintHighlight();
      });
      item.addEventListener('pointerdown', () => {
        focused = null;
        paintHighlight();
      });
      focusItem.addEventListener('focus', () => {
        if (focusItem.matches(':focus-visible')) focused = entry;
        paintHighlight();
      });
      focusItem.addEventListener('keydown', () => {
        if (document.activeElement !== focusItem) return;
        focused = entry;
        paintHighlight();
      });
      focusItem.addEventListener('blur', () => {
        if (focused === entry) focused = null;
        paintHighlight();
      });
    }
    const defs = element('defs');
    svg.append(defs);
    const marker = element('marker', {
      id: 'graph-arrow',
      viewBox: '0 0 10 10',
      refX: 9,
      refY: 5,
      markerWidth: 7,
      markerHeight: 7,
      orient: 'auto',
    });
    marker.append(
      element('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#4b5e75' }),
    );
    defs.append(marker);
    for (const boundary of layout.boundaries) {
      const group = element('g', {
        'data-graph-boundary': boundary.id,
        'data-boundary-kind': boundary.kind,
        'data-boundary-parent': boundary.parent || '',
        [boundary.group === 'context'
          ? 'data-graph-context'
          : 'data-graph-fulfillment']: boundary.id,
        class: `graph-boundary graph-boundary-${boundary.kind}`,
      });
      group.append(
        element('rect', {
          x: boundary.x,
          y: boundary.y,
          width: boundary.width,
          height: boundary.height,
          rx: 10,
          class: 'graph-boundary-frame',
        }),
      );
      const kind =
        {
          domain: '领域上下文',
          contract: '合同上下文',
          fulfillment: '权责履约',
        }[boundary.kind] || '上下文';
      const label = element(
        'text',
        {
          x: boundary.x + 16,
          y: boundary.y + 25,
          class: 'graph-boundary-label',
        },
        `${kind} · ${boundary.label}`,
      );
      label.append(element('title', {}, `${boundary.label} · ${boundary.id}`));
      interactive(label, `定位${kind}：${boundary.label}`, () =>
        select(boundary.id),
      );
      group.append(label);
      bindHighlight(
        group,
        { type: 'boundary', id: boundary.id },
        `${kind} · ${boundary.label}`,
        label,
      );
      svg.append(group);
    }
    const boxes = new Map(layout.boxes.map((b) => [b.id, b]));
    const edgeLayer = element('g', { class: 'graph-edges' });
    svg.append(edgeLayer);
    const visibleEdges = layout.edges;
    function drawEdge(edge, i, roleLink = false) {
      const a = boxes.get(edge.from),
        b = boxes.get(edge.to);
      const right = b.x > a.x;
      const sourceRight = b.x >= a.x;
      const x1 = sourceRight ? a.x + a.width : a.x,
        x2 = right ? b.x : b.x + b.width;
      const y1 = a.y + a.height / 2,
        y2 = b.y + b.height / 2;
      let d;
      if (a.id === b.id)
        d = `M ${a.x + a.width} ${y1 - 12} C ${a.x + a.width + 65} ${y1 - 60}, ${a.x + a.width + 65} ${y1 + 60}, ${a.x + a.width} ${y1 + 12}`;
      else if (a.x === b.x) {
        const end = a.x + a.width,
          lane = end + 24 + (i % 5) * 8;
        d = `M ${end} ${y1} C ${lane} ${y1}, ${lane} ${y2}, ${end} ${y2}`;
      } else
        d = `M ${x1} ${y1} C ${(x1 + x2) / 2} ${y1}, ${(x1 + x2) / 2} ${y2}, ${x2} ${y2}`;
      const group = element('g', {
        class: 'graph-edge',
        'data-highlight-edge': businessGraphEdgeKey(edge),
        ...(roleLink
          ? { 'data-role-link': edge.to }
          : {
              'data-graph-edge': edge.id,
              'data-kind': edge.kind,
              'data-cross-boundary': String(edge.crossBoundary),
            }),
      });
      const label = roleLink
        ? '合同责任角色'
        : businessGraphKinds[edge.kind] || edge.kind;
      const full = `${title(edge.sourceRef || edge.from)} — ${title(edge.targetRef || edge.to)}：${edge.label}（${label}）`;
      const attrs = { d, stroke: '#4b5e75', class: 'graph-line' };
      if (edge.dashed) attrs['stroke-dasharray'] = '5 4';
      if (edge.arrow) attrs['marker-end'] = 'url(#graph-arrow)';
      group.append(
        element('title', {}, full),
        element('path', attrs),
        element('path', { d, class: 'graph-hit' }),
      );
      if (businessGraphState.mode === 'standard' && !roleLink) {
        if (edge.sourceCardinality !== undefined)
          group.append(
            element(
              'text',
              {
                x: x1 + (sourceRight ? 8 : -8),
                'text-anchor': sourceRight ? 'start' : 'end',
                'data-cardinality-for': edge.sourceRef,
                y: y1 - 9,
                class: 'graph-cardinality',
              },
              graphCardinality(edge.sourceCardinality),
            ),
          );
        if (edge.targetCardinality !== undefined)
          group.append(
            element(
              'text',
              {
                x: x2 + (right ? -8 : 8),
                'text-anchor': right ? 'end' : 'start',
                'data-cardinality-for': edge.targetRef,
                y: y2 - 9,
                class: 'graph-cardinality',
              },
              graphCardinality(edge.targetCardinality),
            ),
          );
      }
      interactive(group, full, () =>
        select(roleLink ? edge.detailRef : edge.id),
      );
      bindHighlight(
        group,
        { type: 'edge', id: businessGraphEdgeKey(edge) },
        full,
      );
      edgeLayer.append(group);
    }
    visibleEdges.forEach((e, i) => drawEdge(e, i));
    layout.roleLinks.forEach((e, i) => drawEdge(e, i, true));
    for (const box of layout.boxes) {
      const evidenceRole = box.group === 'role' && box.kind === 'evidence';
      const group = element('g', {
        'data-graph-node': box.id,
        class: `graph-node graph-${box.group}${evidenceRole ? ' graph-evidence-role' : ''}`,
      });
      group.append(
        element('rect', {
          x: box.x,
          y: box.y,
          width: box.width,
          height: box.height,
          rx: box.group === 'evidence' || evidenceRole ? 0 : 12,
        }),
      );
      const content = element('g', { class: 'graph-node-content' });
      const standard = businessGraphState.mode === 'standard';
      if (standard)
        content.append(
          element(
            'text',
            { x: 0, y: 0, class: 'graph-type', 'text-anchor': 'middle' },
            `<${graphTypeLabel(box)}>`,
          ),
        );
      const labelY = standard ? 20 : 0;
      const labelLines = textLines(
        content,
        box.label,
        0,
        labelY,
        'graph-node-label',
      );
      if (standard)
        box.timeFields.forEach((name, i) =>
          content.append(
            element(
              'text',
              {
                x: 0,
                y: labelY + Math.max(0, labelLines - 1) * 19 + 18 + i * 16,
                class: 'graph-time-field',
                'text-anchor': 'middle',
              },
              name,
            ),

    el('h1', node.label),
    el('p', node.id, 'identity'),
    el('span', typeLabel(node), `badge ${node.group}`),
  );
  if (node.description || node.meaning)
    detail.append(el('p', node.description || node.meaning, 'intro'));
  if (node.group === 'rule' && ['completion', 'breach'].includes(node.kind))
    detail.append(
      el(
        'p',
        '未能从绑定和履约归属唯一定位请求，保留规则供核对，不猜测所属 Request。',
        'missing',
      ),
    );
  if (node.parent) {
    const owner = card('所属对象');
    owner.append(link(node.parent));
  }
  if (node.bindings)
    card('规则读取的事实').append(
      table(
        ['绑定', '业务对象', '数量'],
        node.bindings.map((b) => [
          b.alias,
          bindingFact(b),
          b.cardinality || '单个',
        ]),
      ),
    );
  if (node.expression) {
    const section = card('判断表达式 · CEL');
    section.append(el('pre', node.expression));
    section.append(
      el('p', '只展示正式表达式，浏览器不执行第二套业务规则。', 'muted'),
    );
  }
  if (node.group === 'relationship')
    card('关系语义').append(
      table(
        ['起点', '关系', '终点', '起点基数', '终点基数'],
        [
          [
            link(node.sourceRef),
            node.label,
            link(node.targetRef),
            node.sourceCardinality,
            node.targetCardinality,
          ],
        ],
      ),
    );
  if (node.values)
    card('凭证实例值').append(
      table(['字段', '值'], Object.entries(node.values)),
    );
  if (node.group === 'scenario') renderScenario(node);
  if (node.group === 'journey') {
    const steps = card('HTTP 调用顺序 · 静态设计');
    steps.append(
      table(
        ['步骤', '接口能力', '预期状态'],
        node.steps.map((s, i) => [
          i + 1,
          s.capabilityRef ? link(s.capabilityRef) : s.status,
          s.expectStatus,
        ]),
      ),
    );
  }
  if (node.method)
    card('HTTP 契约').append(
      el('pre', `${node.method} ${node.uri}`),
      el(
        'p',
        `幂等：${node.idempotency || '未声明'} · 并发：${node.concurrency || '未声明'}`,
      ),
    );
  if (node.fields?.length)
    card('字段映射').append(
      table(
        ['字段', '类型', '必填', '业务属性'],
        node.fields.map((f) => [
          f.name,
          f.valueType,
          f.required ? '是' : '否',
          f.fmAttributeRef ? link(f.fmAttributeRef) : '协议字段',
        ]),
      ),
    );
  if (node.responses?.length)
    card('响应').append(
      table(
        ['状态码', '含义', '响应表示'],
        node.responses.map((r) => [
          r.status,
          r.description,
          r.representationRef ? link(r.representationRef) : '—',
        ]),
      ),
    );
  renderReferences(node);
}
function renderScenario(node) {
  const summary = card('场景判断');
  summary.append(
    el(
      'p',
      `固定观察时刻：${node.asOf} · ${verdict(node.passed, '预期匹配', '预期不匹配', '未执行')}`,
    ),
  );
  summary.append(
    el(
      'p',
      '场景数据用于模拟；false 可以是正确的反例结果，不等于检查失败。',
      'muted',
    ),
  );
  card('单据推演顺序 · 不代表实际时长').append(
    table(
      ['步骤', '参与角色', '形成凭证', '当时可用凭证'],
      node.steps.map((s) => {
        const available = el('div');
        list(s.availableInstanceRefs || [], '无', available);
        return [
          s.sequence,
          link(s.actingRoleRef),
          link(s.issueInstanceRef),
          available,
        ];
      }),
    ),
  );
  card('规则预期与实际').append(
    table(
      ['规则', '预期', '实际', '匹配'],
      node.evaluations.map((e) => [
        link(e.ruleRef),
        e.expected,
        e.actual,
        verdict(e.passed, '通过', '失败', '未执行'),
      ]),
    ),
  );
  if (node.statuses.length)
    card('履约结果').append(
      table(
        ['履约', '请求', '预期', '实际'],
        node.statuses.map((s) => [
          link(s.fulfillmentRef),
          link(s.requestInstanceRef),
          s.expectedStatus,
          s.status,
        ]),
      ),
    );
  if (node.events.length)
    card('业务时间 · 保留区间与时刻').append(
      table(
        ['凭证', '开始', '截止', '实际时刻'],
        node.events.map((e) => [
          link(e.instanceRef),
          e.values.started_at,
          e.values.expired_at,
          e.values.confirmed_at || e.values.signed_at || e.values.created_at,
        ]),
      ),
    );
}
function renderReferences(
  node,
  target = $('detail'),
  heading = '局部引用关系',
) {
  const section = card(heading, target);
  section.append(
    el('p', '连线表示已声明的引用；不是统一的执行顺序。', 'muted'),
  );
  const columns = el('div', '', 'reference-grid');
  for (const [heading, values, key] of [
    ['依赖与关联', outgoing.get(node.id) || [], 'to'],
    ['被谁使用', incoming.get(node.id) || [], 'from'],
  ]) {
    const side = el('section');
    side.append(el('h3', heading));
    if (!values.length) side.append(el('p', '没有声明的引用', 'muted'));
    for (const edge of values) {
      const row = el('div', '', 'reference-row');
      row.append(el('small', edge.label), link(edge[key]));
      side.append(row);
    }
    columns.append(side);
  }
  section.append(columns);
}
function select(id, remember = true) {
  if (id && !nodes.has(id)) return;
  const requestTarget = requestRuleTarget(nodes.get(id));
  const requestRuleId = requestTarget ? id : '';
  if (requestTarget) id = requestTarget.id;
  if (isDerivation(nodes.get(id))) {
    const target = derivationTarget(nodes.get(id));
    if (!target) {
      $('notice').textContent = `派生规则目标字段未解析：${id}`;
      return;
    }
    id = target.id;
  }
  if (isContainer(nodes.get(id))) {
    revealContainer(id);
    return;
  }
  if (remember && (id !== current || requestRuleId !== focusedRequestRule))
    history.push(focusedRequestRule || current);
  current = id;
  focusedRequestRule = requestRuleId;
  $('back').disabled = history.length === 0;
  $('copy').hidden = !id;
  $('breadcrumbs').replaceChildren(action('模型', () => select('')));
  if (id) {
    const node = nodes.get(id),
      ancestors = [],
      visited = new Set([id]);
    let parent = nodes.get(node.parent);
    while (parent && !visited.has(parent.id)) {
      visited.add(parent.id);
      ancestors.unshift(parent);
      parent = nodes.get(parent.parent);
    }
    ancestors.forEach((n) =>
      $('breadcrumbs').append(el('span', '/'), link(n.id)),
    );
    $('breadcrumbs').append(el('span', '/'), el('span', node.label));
    if (focusedRequestRule)
      $('breadcrumbs').append(
        el('span', '/'),
        el('span', title(focusedRequestRule)),
      );
    renderNode(node.group === 'attribute' ? nodes.get(node.parent) : node);
  } else overview();
  markSelected();
  document
    .querySelector('#tree [aria-current="true"]')
    ?.scrollIntoView({ block: 'nearest' });
  $('main').scrollTop = 0;
  const attribute = document.querySelector('.attribute-selected');
  if (attribute) {
    attribute.focus({ preventScroll: true });
    attribute.scrollIntoView({ block: 'center', inline: 'nearest' });
  } else if (focusedRequestRule) {
    const rule = [...document.querySelectorAll('[data-request-rule]')].find(
      (n) => n.dataset.requestRule === focusedRequestRule,
    );
    rule?.focus({ preventScroll: true });
    rule?.scrollIntoView({ block: 'center', inline: 'nearest' });
  }
}
$('search').addEventListener('input', buildTree);
$('reset').addEventListener('click', () => {
  $('search').value = '';
  buildTree();
});
$('expand').addEventListener('click', () =>
  document.querySelectorAll('#tree details').forEach((d) => {
    d.open = true;
  }),
);
$('collapse').addEventListener('click', () =>
  document.querySelectorAll('#tree details').forEach((d) => {
    d.open = false;
  }),
);
$('home').addEventListener('click', () => select(''));
$('back').addEventListener('click', () => {
  if (history.length) select(history.pop(), false);
});
$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(current);
    $('notice').textContent = '已复制对象 ID';
  } catch {
    $('notice').textContent = `对象 ID：${current}`;
  }
});
document.addEventListener('keydown', (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    $('search').focus();
  }
  if (event.key === 'Escape') {
    $('search').value = '';
    buildTree();
  }
});
try {
  buildTree();
  select('', false);
  $('notice').textContent =
    `只读快照 · ${DATA.generatedAt || '生成时间未提供'} · 服务运行未验证`;
  document.body.dataset.ready = 'true';
} catch (error) {
  $('notice').textContent = `工作台加载失败：${error.message}`;
  throw error;
}
</script>
  </body>
</html>

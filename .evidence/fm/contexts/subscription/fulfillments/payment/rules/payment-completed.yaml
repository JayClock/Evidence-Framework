type: rule
id: rule.payment-completed
kind: completion
label: 收到唯一全额按时付款证明
contextRef: fulfillment.payment
bindings:
  agreement:
    ref: contract.subscription
  request:
    ref: request.payment
  proofs:
    ref: role.payment-proof
    cardinality: many
expression: |-
  request.subscription_id == agreement.subscription_id &&
  request.reader_id == agreement.reader_id && request.column_id ==
  agreement.column_id && request.currency == agreement.currency &&
  request.amount_minor_units == agreement.amount_minor_units &&
  request.amount_minor_units > 0 && proofs.filter(p, p.subscription_id
  == request.subscription_id && p.reader_id == request.reader_id &&
  p.column_id == request.column_id && p.payment_request_id ==
  request.request_id && p.amount_minor_units ==
  request.amount_minor_units && p.currency == request.currency &&
  p.success && p.confirmed_at >= request.started_at && p.confirmed_at
  <= request.expired_at).size() == 1
resultType: bool

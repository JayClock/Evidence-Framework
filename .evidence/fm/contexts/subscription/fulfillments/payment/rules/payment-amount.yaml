type: rule
id: rule.payment-amount
kind: derivation
label: 计算订阅费支付请求amount_minor_units
description: "读取订阅合同（contract.subscription）约定的最小货币单位金额，\
  并将其作为订阅费支付请求（request.payment）的金额。"
contextRef: fulfillment.payment
bindings:
  agreement:
    ref: contract.subscription
expression: agreement.amount_minor_units
resultType: int
target:
  entityRef: request.payment
  attribute: amount_minor_units

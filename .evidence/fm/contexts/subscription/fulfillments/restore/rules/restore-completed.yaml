type: rule
id: rule.restore-completed
kind: completion
label: 已按时免费恢复新版本
description:
  "免费恢复请求（request.restore）与订阅合同（contract.subscription）匹配，\
  恢复所需退款证明（role.restore-refund）与重新上架记录（evidence.relaunch）均在请求前有效，\
  且期限内恰有一份收费为零的免费恢复凭证（confirmation.restore）时，\
  判定免费恢复履约（fulfillment.restore）完成。"
contextRef: fulfillment.restore
bindings:
  agreement:
    ref: contract.subscription
  request:
    ref: request.restore
  refunds:
    ref: role.restore-refund
    cardinality: many
  notices:
    ref: evidence.relaunch
    cardinality: many
  confirmations:
    ref: confirmation.restore
    cardinality: many
expression: |-
  request.subscription_id == agreement.subscription_id &&
  request.reader_id == agreement.reader_id && request.column_id ==
  agreement.column_id && refunds.exists(p, p.subscription_id ==
  request.subscription_id && p.reader_id == request.reader_id &&
  p.column_id == request.column_id && p.settled &&
  p.amount_minor_units == agreement.amount_minor_units && p.currency
  == agreement.currency && p.confirmed_at <= request.started_at) &&
  notices.exists(n, n.subscription_id == request.subscription_id &&
  n.reader_id == request.reader_id && n.column_id == request.column_id
  && n.edition_id == request.edition_id && n.listed && n.relaunched_at
  <= n.created_at && n.created_at <= request.started_at) &&
  confirmations.filter(c, c.request_id == request.request_id &&
  c.subscription_id == request.subscription_id && c.reader_id ==
  request.reader_id && c.column_id == request.column_id &&
  c.confirmed_at >= request.started_at && c.confirmed_at <=
  request.expired_at && c.edition_id == request.edition_id &&
  c.charged_minor_units == 0 && c.restored).size() == 1
resultType: bool

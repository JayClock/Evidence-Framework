type: rule
id: rule.refund-amount
kind: derivation
label: 引用原合同退款金额
description: "读取订阅合同（contract.subscription）约定的最小货币单位金额，\
  并将其作为断更退款请求（request.refund）的全额退款金额。"
contextRef: fulfillment.refund
bindings:
  agreement:
    ref: contract.subscription
expression: agreement.amount_minor_units
resultType: int
target:
  entityRef: request.refund
  attribute: amount_minor_units

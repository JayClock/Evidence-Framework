type: entity
id: confirmation.refund
category: evidence
kind: fulfillment_confirmation
label: 退款到账凭证
contextRef: fulfillment.refund
attributes:
  - name: request_id
    label: 对应请求编号
    valueType: string
    required: true
    keyData: true
    meaning: 对应请求编号
  - name: subscription_id
    label: 订阅编号
    valueType: string
    required: true
    keyData: true
    meaning: 双方订阅合同的稳定编号；后续凭证引用原合同
  - name: reader_id
    label: 读者编号
    valueType: string
    required: true
    keyData: true
    meaning: 本人合同绑定的稳定读者身份
  - name: column_id
    label: 专栏编号
    valueType: string
    required: true
    keyData: true
    meaning: 合同约定的专栏稳定编号；跨上架版本不变
  - name: confirmed_at
    label: 履约确认时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 原资金渠道确认退款到账的实际时刻，不是发起退款时间
  - name: amount_minor_units
    label: 实退金额
    valueType: int
    required: true
    keyData: true
    meaning: 原渠道实际到账的退款金额
  - name: currency
    label: 实退币种
    valueType: string
    required: true
    keyData: true
    meaning: 实退币种
  - name: receipt_id
    label: 到账回执编号
    valueType: string
    required: true
    keyData: true
    meaning: 原资金渠道可核验的到账回执
  - name: settled
    label: 退款已到账
    valueType: bool
    required: true
    keyData: true
    meaning: 原资金渠道证实收款方已经收到退款
notes: 保留原请求编号和主体标的，证明实际履约结果；不代表人工审批。
responsibleRoleRef: role.publisher

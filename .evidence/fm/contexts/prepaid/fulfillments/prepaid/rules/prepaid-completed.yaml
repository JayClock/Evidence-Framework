type: rule
id: rule.prepaid-completed
kind: completion
label: 本次扣款全额按时完成
description:
  "账户余额足够时，余额抵扣请求（request.prepaid）在期限内恰有一份身份、金额、币种和扣后余额均匹配的成功结果（con\
  firmation.prepaid）时，判定余额抵扣履约（fulfillment.prepaid）完成。"
contextRef: fulfillment.prepaid
bindings:
  request:
    ref: request.prepaid
  confirmations:
    ref: confirmation.prepaid
    cardinality: many
expression: |-
  confirmations.filter(c, c.request_id == request.request_id &&
  c.subscription_id == request.subscription_id && c.reader_id ==
  request.reader_id && c.column_id == request.column_id &&
  c.confirmed_at >= request.started_at && c.confirmed_at <=
  request.expired_at && c.payment_request_id ==
  request.payment_request_id && c.amount_minor_units ==
  request.amount_minor_units && c.currency == request.currency &&
  c.success && request.balance_before_minor_units >=
  request.amount_minor_units && c.balance_after_minor_units ==
  request.balance_before_minor_units - c.amount_minor_units &&
  c.balance_after_minor_units >= 0).size() == 1
resultType: bool

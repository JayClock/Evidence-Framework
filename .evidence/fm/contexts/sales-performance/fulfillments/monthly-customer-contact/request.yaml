type: entity
id: request.monthly-customer-contact
category: evidence
kind: fulfillment_request
label: 月度客户联系目标请求
contextRef: fulfillment.monthly-customer-contact
attributes:
  - name: request_id
    label: 目标请求编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次月度客户联系目标请求的稳定编号
  - name: agreement_id
    label: 绩效协议编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次目标所属绩效协议的编号
  - name: period_id
    label: 业务周期编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次月度目标所适用的业务周期编号
  - name: started_at
    label: 目标周期开始时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 双方约定的本次月度客户联系目标开始时刻
  - name: expired_at
    label: 目标周期截止时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 双方约定的本次月度客户联系目标截止时刻
  - name: target_contact_count
    label: 客户联系总目标数
    valueType: int
    required: true
    keyData: true
    meaning: 绩效协议实例为本周期约定的客户联系总次数目标
  - name: target_phone_count
    label: 电话联系目标数
    valueType: int
    required: true
    keyData: true
    meaning: 绩效协议实例为本周期约定的电话联系次数目标
  - name: target_email_count
    label: 邮件联系目标数
    valueType: int
    required: true
    keyData: true
    meaning: 绩效协议实例为本周期约定的邮件联系次数目标
notes: >-
  目标数是每份协议实例中的约定值，来源文章没有给出固定数值或统一计算公式。
responsibleRoleRef: role.performance-manager

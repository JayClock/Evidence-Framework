type: rule
id: rule.mobile-completed
kind: completion
label: 本次扣款全额按时完成
description:
  "移动支付扣款请求（request.mobile）在期限内恰有一份与订阅、读者、专栏、父付款请求、金额和币种匹配的成功结果（con\
  firmation.mobile）时，判定移动支付扣款履约（fulfillment.mobile）完成。"
contextRef: fulfillment.mobile
bindings:
  request:
    ref: request.mobile
  confirmations:
    ref: confirmation.mobile
    cardinality: many
expression: |-
  confirmations.filter(c, c.request_id == request.request_id &&
  c.subscription_id == request.subscription_id && c.reader_id ==
  request.reader_id && c.column_id == request.column_id &&
  c.confirmed_at >= request.started_at && c.confirmed_at <=
  request.expired_at && c.payment_request_id ==
  request.payment_request_id && c.amount_minor_units ==
  request.amount_minor_units && c.currency == request.currency &&
  c.success).size() == 1
resultType: bool

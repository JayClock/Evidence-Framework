type: entity
id: request.refund
category: evidence
kind: fulfillment_request
label: 断更退款请求
contextRef: fulfillment.refund
attributes:
  - name: request_id
    label: 请求编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次责任请求的唯一编号
  - name: subscription_id
    label: 订阅编号
    valueType: string
    required: true
    keyData: true
    meaning: 双方订阅合同的稳定编号；后续凭证引用原合同
  - name: reader_id
    label: 读者编号
    valueType: string
    required: true
    keyData: true
    meaning: 本人合同绑定的稳定读者身份
  - name: column_id
    label: 专栏编号
    valueType: string
    required: true
    keyData: true
    meaning: 合同约定的专栏稳定编号；跨上架版本不变
  - name: started_at
    label: 请求开始时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 权利方实际提出本次履约主张的时刻
  - name: expired_at
    label: 履约截止时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 请求开始加合同约定的本项秒数
    derivedByRuleRef: rule.refund-deadline
  - name: amount_minor_units
    label: 应退金额
    valueType: int
    required: true
    keyData: true
    meaning: 原合同成交金额且须等于原全额实付
    derivedByRuleRef: rule.refund-amount
  - name: currency
    label: 退款币种
    valueType: string
    required: true
    keyData: true
    meaning: 与原合同和实付币种相同
notes: 一项独立责任的起止区间；原请求不因超时或重试而被覆盖。
responsibleRoleRef: role.reader

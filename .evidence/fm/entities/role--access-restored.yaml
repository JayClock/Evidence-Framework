type: entity
id: role.access-restored
category: role
kind: evidence
label: 免费恢复资格证明
contextRef: fulfillment.access
attributes:
  - name: request_id
    label: 对应请求编号
    valueType: string
    required: true
    keyData: false
    meaning: 具体玩家应提供的对应请求编号，不是角色自身的记录
  - name: subscription_id
    label: 订阅编号
    valueType: string
    required: true
    keyData: false
    meaning: 具体玩家应提供的订阅编号，不是角色自身的记录
  - name: reader_id
    label: 读者编号
    valueType: string
    required: true
    keyData: false
    meaning: 具体玩家应提供的读者编号，不是角色自身的记录
  - name: column_id
    label: 专栏编号
    valueType: string
    required: true
    keyData: false
    meaning: 具体玩家应提供的专栏编号，不是角色自身的记录
  - name: confirmed_at
    label: 履约确认时刻
    valueType: timestamp
    required: true
    keyData: false
    meaning: 具体玩家应提供的履约确认时刻，不是角色自身的记录
  - name: edition_id
    label: 已恢复版本
    valueType: string
    required: true
    keyData: false
    meaning: 具体玩家应提供的已恢复版本，不是角色自身的记录
  - name: charged_minor_units
    label: 实收金额
    valueType: int
    required: true
    keyData: false
    meaning: 具体玩家应提供的实收金额，不是角色自身的记录
  - name: restored
    label: 资格已恢复
    valueType: bool
    required: true
    keyData: false
    meaning: 具体玩家应提供的资格已恢复，不是角色自身的记录
notes: 消费方只依赖证明约定；实际玩家保留原合同责任，不复制成订阅合同中的新付款凭证。

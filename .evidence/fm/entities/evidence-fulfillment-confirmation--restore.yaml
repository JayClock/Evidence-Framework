type: entity
id: confirmation.restore
category: evidence
kind: fulfillment_confirmation
label: 免费恢复凭证
contextRef: fulfillment.restore
attributes:
  - name: request_id
    label: 对应请求编号
    valueType: string
    required: true
    keyData: true
    meaning: 对应请求编号
  - name: subscription_id
    label: 订阅编号
    valueType: string
    required: true
    keyData: true
    meaning: 双方订阅合同的稳定编号；后续凭证引用原合同
  - name: reader_id
    label: 读者编号
    valueType: string
    required: true
    keyData: true
    meaning: 本人合同绑定的稳定读者身份
  - name: column_id
    label: 专栏编号
    valueType: string
    required: true
    keyData: true
    meaning: 合同约定的专栏稳定编号；跨上架版本不变
  - name: confirmed_at
    label: 履约确认时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 平台实际完成免费恢复访问资格的时刻
  - name: edition_id
    label: 已恢复版本
    valueType: string
    required: true
    keyData: true
    meaning: 已恢复版本
  - name: charged_minor_units
    label: 实收金额
    valueType: int
    required: true
    keyData: true
    meaning: 恢复办理的实际收取金额，免费条款要求为0
  - name: restored
    label: 资格已恢复
    valueType: bool
    required: true
    keyData: true
    meaning: 平台已经恢复该读者对指定专栏新版本的访问资格
notes: 保留原请求编号和主体标的，证明实际履约结果；不代表人工审批。
responsibleRoleRef: role.publisher

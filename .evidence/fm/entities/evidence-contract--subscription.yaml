type: entity
id: contract.subscription
category: evidence
kind: contract
label: 专栏订阅合同
contextRef: context.subscription
attributes:
  - name: subscription_id
    label: 订阅编号
    valueType: string
    required: true
    keyData: true
    meaning: 双方订阅合同的稳定编号；后续凭证引用原合同
  - name: reader_id
    label: 读者编号
    valueType: string
    required: true
    keyData: true
    meaning: 本人合同绑定的稳定读者身份
  - name: column_id
    label: 专栏编号
    valueType: string
    required: true
    keyData: true
    meaning: 合同约定的专栏稳定编号；跨上架版本不变
  - name: edition_id
    label: 订阅版本
    valueType: string
    required: true
    keyData: true
    meaning: 订阅版本
  - name: amount_minor_units
    label: 成交金额
    valueType: int
    required: true
    keyData: true
    meaning: 双方接受并冻结的订阅成交金额，单位为分
  - name: currency
    label: 结算币种
    valueType: string
    required: true
    keyData: true
    meaning: 双方约定CNY，不转换汇率
  - name: signed_at
    label: 签约时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 双方完成条款接受的业务时刻
  - name: payment_seconds
    label: 付款期限秒数
    valueType: int
    required: true
    keyData: true
    meaning: 双方接受的付款条款：900秒
  - name: access_seconds
    label: 内容提供期限秒数
    valueType: int
    required: true
    keyData: true
    meaning: 双方接受的逐次内容提供期限：60秒
  - name: refund_seconds
    label: 退款期限秒数
    valueType: int
    required: true
    keyData: true
    meaning: 双方接受的退款期限：604800秒
  - name: restore_seconds
    label: 恢复期限秒数
    valueType: int
    required: true
    keyData: true
    meaning: 双方接受的免费恢复期限：86400秒
notes: 一份合同绑定一个读者、一个专栏版本和一次全额付款要求。
roleRefs:
  - role.reader
  - role.publisher

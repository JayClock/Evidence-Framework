type: entity
id: request.prepaid
category: evidence
kind: fulfillment_request
label: 账户余额抵扣请求
contextRef: fulfillment.prepaid
attributes:
  - name: request_id
    label: 请求编号
    valueType: string
    required: true
    keyData: true
    meaning: 本次责任请求的唯一编号
  - name: subscription_id
    label: 订阅编号
    valueType: string
    required: true
    keyData: true
    meaning: 双方订阅合同的稳定编号；后续凭证引用原合同
  - name: reader_id
    label: 读者编号
    valueType: string
    required: true
    keyData: true
    meaning: 本人合同绑定的稳定读者身份
  - name: column_id
    label: 专栏编号
    valueType: string
    required: true
    keyData: true
    meaning: 合同约定的专栏稳定编号；跨上架版本不变
  - name: started_at
    label: 请求开始时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 权利方实际提出本次履约主张的时刻
  - name: expired_at
    label: 扣款截止时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 引用订阅付款请求的截止，不得由支付接入延长
  - name: payment_request_id
    label: 订阅付款请求编号
    valueType: string
    required: true
    keyData: true
    meaning: 引用订阅合同内的付款请求
  - name: amount_minor_units
    label: 扣款金额
    valueType: int
    required: true
    keyData: true
    meaning: 引用原订阅付款请求金额
  - name: currency
    label: 扣款币种
    valueType: string
    required: true
    keyData: true
    meaning: 引用原订阅付款请求币种
  - name: agreement_id
    label: 支付协议编号
    valueType: string
    required: true
    keyData: true
    meaning: 引用本人签署的资金服务协议
  - name: balance_before_minor_units
    label: 扣前可用余额
    valueType: int
    required: true
    keyData: true
    meaning: 账户服务方从本人账本取得的本次核验快照，不接受用户自报余额
notes: 一项独立责任的起止区间；原请求不因超时或重试而被覆盖。
responsibleRoleRef: role.account-user

type: entity
id: confirmation.access
category: evidence
kind: fulfillment_confirmation
label: 内容提供凭证
contextRef: fulfillment.access
attributes:
  - name: request_id
    label: 对应请求编号
    valueType: string
    required: true
    keyData: true
    meaning: 对应请求编号
  - name: subscription_id
    label: 订阅编号
    valueType: string
    required: true
    keyData: true
    meaning: 双方订阅合同的稳定编号；后续凭证引用原合同
  - name: reader_id
    label: 读者编号
    valueType: string
    required: true
    keyData: true
    meaning: 本人合同绑定的稳定读者身份
  - name: column_id
    label: 专栏编号
    valueType: string
    required: true
    keyData: true
    meaning: 合同约定的专栏稳定编号；跨上架版本不变
  - name: confirmed_at
    label: 履约确认时刻
    valueType: timestamp
    required: true
    keyData: true
    meaning: 平台已提供该版本可检索内容的实际时刻
  - name: chapter_id
    label: 已提供章节编号
    valueType: string
    required: true
    keyData: true
    meaning: 已提供章节编号
  - name: edition_id
    label: 已提供版本
    valueType: string
    required: true
    keyData: true
    meaning: 已提供版本
  - name: delivered
    label: 内容已提供
    valueType: bool
    required: true
    keyData: true
    meaning: 指定内容已向本读者提供并可检索，不声明读者已经阅读
notes: 保留原请求编号和主体标的，证明实际履约结果；不代表人工审批。
responsibleRoleRef: role.publisher

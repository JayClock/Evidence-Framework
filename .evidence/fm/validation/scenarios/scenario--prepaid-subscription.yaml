type: fm_scenario
id: scenario.prepaid-subscription
label: 预付费抵扣后访问内容
asOf: '2026-10-01T09:10:00Z'
givenInstanceRefs: []
steps:
  - sequence: 1
    actingRoleRef: role.reader
    issueInstanceRef: instance.subscription
    availableInstanceRefs: []
  - sequence: 2
    actingRoleRef: role.account-user
    issueInstanceRef: instance.prepaid-agreement
    availableInstanceRefs:
      - instance.subscription
  - sequence: 3
    actingRoleRef: role.publisher
    issueInstanceRef: instance.payment
    availableInstanceRefs:
      - instance.subscription
      - instance.prepaid-agreement
  - sequence: 4
    actingRoleRef: role.account-user
    issueInstanceRef: instance.prepaid-request
    availableInstanceRefs:
      - instance.subscription
      - instance.prepaid-agreement
      - instance.payment
  - sequence: 5
    actingRoleRef: role.account-provider
    issueInstanceRef: instance.prepaid-result
    availableInstanceRefs:
      - instance.subscription
      - instance.prepaid-agreement
      - instance.payment
      - instance.prepaid-request
  - sequence: 6
    actingRoleRef: role.reader
    issueInstanceRef: instance.access-prepaid
    availableInstanceRefs:
      - instance.subscription
      - instance.prepaid-agreement
      - instance.payment
      - instance.prepaid-request
      - instance.prepaid-result
  - sequence: 7
    actingRoleRef: role.publisher
    issueInstanceRef: instance.content-prepaid
    availableInstanceRefs:
      - instance.subscription
      - instance.prepaid-agreement
      - instance.payment
      - instance.prepaid-request
      - instance.prepaid-result
      - instance.access-prepaid
evaluations:
  - ruleRef: rule.payment-start
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:00:00Z'
  - ruleRef: rule.payment-amount
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: 9900
  - ruleRef: rule.payment-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:15:00Z'
  - ruleRef: rule.prepaid-balance
    bindings:
      request:
        instanceRef: instance.prepaid-request
      confirmation:
        instanceRef: instance.prepaid-result
    targetInstanceRef: instance.prepaid-result
    expectedResult: 100
  - ruleRef: rule.access-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-prepaid
    targetInstanceRef: instance.access-prepaid
    expectedResult: '2026-10-01T09:07:00Z'
  - ruleRef: rule.payment-completed
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
      proofs:
        instanceRefs:
          - instance.prepaid-result
    expectedResult: true
  - ruleRef: rule.payment-expired
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
      proofs:
        instanceRefs:
          - instance.prepaid-result
    expectedResult: false
  - ruleRef: rule.prepaid-completed
    bindings:
      request:
        instanceRef: instance.prepaid-request
      confirmations:
        instanceRefs:
          - instance.prepaid-result
    expectedResult: true
  - ruleRef: rule.prepaid-expired
    bindings:
      request:
        instanceRef: instance.prepaid-request
      confirmations:
        instanceRefs:
          - instance.prepaid-result
    expectedResult: false
  - ruleRef: rule.access-completed
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-prepaid
      payments:
        instanceRefs:
          - instance.prepaid-result
      refunds:
        instanceRefs: []
      restorations:
        instanceRefs: []
      confirmations:
        instanceRefs:
          - instance.content-prepaid
    expectedResult: true
  - ruleRef: rule.access-expired
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-prepaid
      payments:
        instanceRefs:
          - instance.prepaid-result
      refunds:
        instanceRefs: []
      restorations:
        instanceRefs: []
      confirmations:
        instanceRefs:
          - instance.content-prepaid
    expectedResult: false
expectations:
  fulfillmentStatuses:
    - fulfillmentRef: fulfillment.payment
      requestInstanceRef: instance.payment
      status: completed
    - fulfillmentRef: fulfillment.prepaid
      requestInstanceRef: instance.prepaid-request
      status: completed
    - fulfillmentRef: fulfillment.access
      requestInstanceRef: instance.access-prepaid
      status: completed
stakeholderReview:
  status: pending
notes: 以固定业务时刻和独立凭证回放；仅使用当步已有且可见的证据。

type: fm_scenario
id: scenario.mobile-subscription
label: 移动支付后访问内容
asOf: '2026-10-01T09:10:00Z'
givenInstanceRefs: []
steps:
  - sequence: 1
    actingRoleRef: role.reader
    issueInstanceRef: instance.subscription
    availableInstanceRefs: []
  - sequence: 2
    actingRoleRef: role.mobile-user
    issueInstanceRef: instance.mobile-agreement
    availableInstanceRefs:
      - instance.subscription
  - sequence: 3
    actingRoleRef: role.publisher
    issueInstanceRef: instance.payment
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
  - sequence: 4
    actingRoleRef: role.mobile-user
    issueInstanceRef: instance.mobile-request
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
      - instance.payment
  - sequence: 5
    actingRoleRef: role.mobile-provider
    issueInstanceRef: instance.mobile-result
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
      - instance.payment
      - instance.mobile-request
  - sequence: 6
    actingRoleRef: role.reader
    issueInstanceRef: instance.access-mobile
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
      - instance.payment
      - instance.mobile-request
      - instance.mobile-result
  - sequence: 7
    actingRoleRef: role.publisher
    issueInstanceRef: instance.content-mobile
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
      - instance.payment
      - instance.mobile-request
      - instance.mobile-result
      - instance.access-mobile
evaluations:
  - ruleRef: rule.payment-start
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:00:00Z'
  - ruleRef: rule.payment-amount
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: 9900
  - ruleRef: rule.payment-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:15:00Z'
  - ruleRef: rule.access-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-mobile
    targetInstanceRef: instance.access-mobile
    expectedResult: '2026-10-01T09:07:00Z'
  - ruleRef: rule.payment-completed
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
      proofs:
        instanceRefs:
          - instance.mobile-result
    expectedResult: true
  - ruleRef: rule.payment-expired
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
      proofs:
        instanceRefs:
          - instance.mobile-result
    expectedResult: false
  - ruleRef: rule.mobile-completed
    bindings:
      request:
        instanceRef: instance.mobile-request
      confirmations:
        instanceRefs:
          - instance.mobile-result
    expectedResult: true
  - ruleRef: rule.mobile-expired
    bindings:
      request:
        instanceRef: instance.mobile-request
      confirmations:
        instanceRefs:
          - instance.mobile-result
    expectedResult: false
  - ruleRef: rule.access-completed
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-mobile
      payments:
        instanceRefs:
          - instance.mobile-result
      refunds:
        instanceRefs: []
      restorations:
        instanceRefs: []
      confirmations:
        instanceRefs:
          - instance.content-mobile
    expectedResult: true
  - ruleRef: rule.access-expired
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-mobile
      payments:
        instanceRefs:
          - instance.mobile-result
      refunds:
        instanceRefs: []
      restorations:
        instanceRefs: []
      confirmations:
        instanceRefs:
          - instance.content-mobile
    expectedResult: false
expectations:
  fulfillmentStatuses:
    - fulfillmentRef: fulfillment.payment
      requestInstanceRef: instance.payment
      status: completed
    - fulfillmentRef: fulfillment.mobile
      requestInstanceRef: instance.mobile-request
      status: completed
    - fulfillmentRef: fulfillment.access
      requestInstanceRef: instance.access-mobile
      status: completed
stakeholderReview:
  status: pending
notes: 以固定业务时刻和独立凭证回放；仅使用当步已有且可见的证据。

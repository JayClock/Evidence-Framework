type: fm_scenario
id: scenario.access-after-refund
label: 退款后旧版访问资格失效但历史提供记录不改写
asOf: '2026-10-18T11:02:00Z'
givenInstanceRefs:
  - instance.subscription
  - instance.mobile-agreement
  - instance.payment
  - instance.mobile-request
  - instance.mobile-result
  - instance.access-mobile
  - instance.content-mobile
steps:
  - sequence: 1
    actingRoleRef: role.publisher
    issueInstanceRef: instance.discontinuation
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
      - instance.payment
      - instance.mobile-request
      - instance.mobile-result
      - instance.access-mobile
      - instance.content-mobile
  - sequence: 2
    actingRoleRef: role.reader
    issueInstanceRef: instance.refund
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
      - instance.payment
      - instance.mobile-request
      - instance.mobile-result
      - instance.access-mobile
      - instance.content-mobile
      - instance.discontinuation
  - sequence: 3
    actingRoleRef: role.publisher
    issueInstanceRef: instance.refunded
    availableInstanceRefs:
      - instance.subscription
      - instance.mobile-agreement
      - instance.payment
      - instance.mobile-request
      - instance.mobile-result
      - instance.access-mobile
      - instance.content-mobile
      - instance.discontinuation
      - instance.refund
evaluations:
  - ruleRef: rule.payment-start
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:00:00Z'
  - ruleRef: rule.payment-amount
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: 9900
  - ruleRef: rule.payment-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:15:00Z'
  - ruleRef: rule.access-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-mobile
    targetInstanceRef: instance.access-mobile
    expectedResult: '2026-10-01T09:07:00Z'
  - ruleRef: rule.refund-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.refund
    targetInstanceRef: instance.refund
    expectedResult: '2026-10-23T10:01:00Z'
  - ruleRef: rule.refund-amount
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.refund
    expectedResult: 9900
  - ruleRef: rule.access-completed
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-mobile
      payments:
        instanceRefs:
          - instance.mobile-result
      refunds:
        instanceRefs:
          - instance.refunded
      restorations:
        instanceRefs: []
      confirmations:
        instanceRefs:
          - instance.content-mobile
    expectedResult: true
  - ruleRef: rule.access-expired
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-mobile
      payments:
        instanceRefs:
          - instance.mobile-result
      refunds:
        instanceRefs:
          - instance.refunded
      restorations:
        instanceRefs: []
      confirmations:
        instanceRefs:
          - instance.content-mobile
    expectedResult: false
  - ruleRef: rule.refund-completed
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.refund
      payments:
        instanceRefs:
          - instance.mobile-result
      notices:
        instanceRefs:
          - instance.discontinuation
      confirmations:
        instanceRefs:
          - instance.refunded
    expectedResult: true
  - ruleRef: rule.refund-expired
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.refund
      payments:
        instanceRefs:
          - instance.mobile-result
      notices:
        instanceRefs:
          - instance.discontinuation
      confirmations:
        instanceRefs:
          - instance.refunded
    expectedResult: false
  - ruleRef: rule.content-readable
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.access-mobile
      payments:
        instanceRefs:
          - instance.mobile-result
      refunds:
        instanceRefs:
          - instance.refunded
      restorations:
        instanceRefs: []
      confirmations:
        instanceRefs:
          - instance.content-mobile
    expectedResult: false
expectations:
  fulfillmentStatuses:
    - fulfillmentRef: fulfillment.access
      requestInstanceRef: instance.access-mobile
      status: completed
    - fulfillmentRef: fulfillment.refund
      requestInstanceRef: instance.refund
      status: completed
stakeholderReview:
  status: pending
notes: 以固定业务时刻和独立凭证回放；仅使用当步已有且可见的证据。

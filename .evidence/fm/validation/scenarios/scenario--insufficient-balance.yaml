type: fm_scenario
id: scenario.insufficient-balance
label: 余额不足不得扣款或开通订阅
asOf: '2026-10-01T09:16:00Z'
givenInstanceRefs:
  - instance.subscription
  - instance.prepaid-agreement
  - instance.payment
steps:
  - sequence: 1
    actingRoleRef: role.account-user
    issueInstanceRef: instance.prepaid-insufficient
    availableInstanceRefs:
      - instance.subscription
      - instance.prepaid-agreement
      - instance.payment
evaluations:
  - ruleRef: rule.payment-start
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:00:00Z'
  - ruleRef: rule.payment-amount
    bindings:
      agreement:
        instanceRef: instance.subscription
    targetInstanceRef: instance.payment
    expectedResult: 9900
  - ruleRef: rule.payment-deadline
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
    targetInstanceRef: instance.payment
    expectedResult: '2026-10-01T09:15:00Z'
  - ruleRef: rule.prepaid-completed
    bindings:
      request:
        instanceRef: instance.prepaid-insufficient
      confirmations:
        instanceRefs: []
    expectedResult: false
  - ruleRef: rule.prepaid-expired
    bindings:
      request:
        instanceRef: instance.prepaid-insufficient
      confirmations:
        instanceRefs: []
    expectedResult: true
  - ruleRef: rule.payment-completed
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
      proofs:
        instanceRefs: []
    expectedResult: false
  - ruleRef: rule.payment-expired
    bindings:
      agreement:
        instanceRef: instance.subscription
      request:
        instanceRef: instance.payment
      proofs:
        instanceRefs: []
    expectedResult: true
  - ruleRef: rule.prepaid-funded
    bindings:
      request:
        instanceRef: instance.prepaid-insufficient
    expectedResult: false
expectations:
  fulfillmentStatuses:
    - fulfillmentRef: fulfillment.prepaid
      requestInstanceRef: instance.prepaid-insufficient
      status: breached
    - fulfillmentRef: fulfillment.payment
      requestInstanceRef: instance.payment
      status: breached
stakeholderReview:
  status: pending
notes: 以固定业务时刻和独立凭证回放；仅使用当步已有且可见的证据。

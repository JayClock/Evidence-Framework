      parameter: chapterId
      attributeRef: thing.chapter#chapter_id
  - id: resource.sales-performance-agreement
    businessName: 电话销售绩效协议
    entityRef: contract.sales-performance
    segment: sales-performance-agreements
    shape: collection
    basis:
      fmRefs:
        - contract.sales-performance
        - role.tele-sales
      reasoning: 电话销售按场景登记双方已经达成的绩效协议；登记不替代双方达成协议的业务事实。
    identity:
      kind: fm_attribute
      parameter: agreementId
      attributeRef: contract.sales-performance#agreement_id
  - id: resource.monthly-customer-contact-target
    businessName: 月度客户联系目标请求
    entityRef: request.monthly-customer-contact
    segment: monthly-customer-contact-targets
    shape: collection
    parentRef: resource.sales-performance-agreement
    parentBindingRef: binding.parent-monthly-customer-contact-target
    cardinality:
      relationshipRef: relation.sales-performance-to-monthly-contact
    basis:
      fmRefs:
        - contract.sales-performance
        - request.monthly-customer-contact
        - relation.sales-performance-to-monthly-contact
      reasoning: 同一绩效协议可在多个业务周期形成目标请求，每份请求以自身编号定位。
    identity:
      kind: fm_attribute
      parameter: targetId
      attributeRef: request.monthly-customer-contact#request_id
  - id: resource.customer-contact-record
    businessName: 客户联系记录
    entityRef: confirmation.customer-contact-record
    segment: contact-records
    shape: collection
    parentRef: resource.monthly-customer-contact-target
    parentBindingRef: binding.parent-customer-contact-record
    cardinality:
      relationshipRef: relation.monthly-contact-to-record
    basis:
      fmRefs:
        - request.monthly-customer-contact
        - confirmation.customer-contact-record
        - relation.monthly-contact-to-record
        - relation.customer-contact-references-profile
      reasoning: 每份月度目标可形成多份实际联系记录，记录以自身编号定位并引用既有客户档案。
    identity:
      kind: fm_attribute
      parameter: recordId
      attributeRef: confirmation.customer-contact-record#record_id
bindings:
  - id: binding.caller-subscription-reader
    kind: caller_role
    roleRef: role.reader
    scopeResourceRef: resource.subscription
    basis:
      fmRefs:
        - contract.subscription
        - role.reader
      reasoning: 调用者必须是本实例的合同参与方；读者只读本人单据，服务方只处理本机构责任。章节还须核验本人的指定版本访问资格。
  - id: binding.caller-account-account-user
    kind: caller_role
    roleRef: role.account-user
    scopeResourceRef: resource.account
    basis:
      fmRefs:
        - contract.prepaid
        - role.account-user
      reasoning: 调用者必须是本实例的合同参与方；读者只读本人单据，服务方只处理本机构责任。章节还须核验本人的指定版本访问资格。
  - id: binding.parent-payment
    kind: parent_child
    parentResourceRef: resource.subscription
    childResourceRef: resource.payment
    basis:
      fmRefs:
        - request.payment
        - contract.subscription
        - relation.contract-payment
      reasoning: 用相同合同、读者及请求编号与既有证据引用核验父子归属，不仅凭URI认定。
  - id: binding.caller-payment-reader

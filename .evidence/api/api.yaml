schemaVersion: '4.0'
id: api.column-subscription
sources: []
decisions:
  - id: decision.identities
    category: identity
    statement: 业务实例按稳定编号寻址，确定唯一的结果使用父级单例路径
    reasoning: 凭证始终有自己的身份；单例路径不授权覆盖或删除旧证据。
  - id: decision.navigation
    category: navigation
    statement: 订阅、预付费账户、专栏和章节保留独立根，跨边界通过链接发现
    reasoning: 请求沿合同根归属；证明角色不成为独立写入资源。
nonApiActivities:
  - entityRef: confirmation.mobile
    handling: external
    basis:
      fmRefs:
        - confirmation.mobile
      reasoning: >-
        移动支付机构交付并负责其协议、扣款请求和实际扣款证明；本平台核验既有凭证，不代替机构提供接口。
  - entityRef: party.publisher
    handling: internal
    basis:
      fmRefs:
        - party.publisher
      reasoning: 主体用于跨合同身份绑定，不提供人员或机构档案管理接口。

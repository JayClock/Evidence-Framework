    basis:
      fmRefs:
        - contract.subscription
        - evidence.relaunch
      reasoning: 用重新上架记录中的原订阅、读者和专栏编号核验活动归属，不仅凭 URI 认定。
      sourceRefs:
        - source.restore-per-relaunch

      reasoning: 移动支付机构交付并负责其协议、扣款请求和实际扣款证明；本平台核验既有凭证，不代替机构提供接口。
  - entityRef: confirmation.access
    handling: internal
    basis:
      fmRefs:
        - confirmation.access
        - role.publisher
      reasoning: 无 participant.party 扮演该责任角色，当前 API 不暴露其写入；形成步骤以非 API 活动回映。
  - entityRef: confirmation.prepaid
    handling: internal
    basis:
      fmRefs:
        - confirmation.prepaid
        - role.account-provider
      reasoning: 无 participant.party 扮演该责任角色，当前 API 不暴露其写入；形成步骤以非 API 活动回映。

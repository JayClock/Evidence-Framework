schemaVersion: '4.0'
id: api.column-subscription
sources:
  - id: source.restore-per-relaunch
    path: .evidence/discovery.md
    locator: B07｜实例归属和办理权限
    quote: 同一订阅允许保存多份断更核验及重新上架记录以保留历史，各次形成均有独立身份，但全额退款和同次活动恢复不可重复。
  - id: source.party-contract-list
    path: .evidence/discovery.md
    locator: B07｜实例归属和办理权限
    quote: >-
      读者仅办理和查询自己参加的订阅、自己的预付费账户及扣款请求；平台仅办理自己为责任方的合同、内容提供、断更核验、退款到账和免费恢复。
decisions:
  - id: decision.identities
    category: identity
    statement: 业务实例按稳定编号寻址，确定唯一的结果使用父级单例路径
    reasoning: 凭证始终有自己的身份；单例路径不授权覆盖或删除旧证据。
  - id: decision.navigation
    category: navigation
    statement: 订阅、预付费账户、专栏和章节保留独立根；重新上架活动及免费恢复沿原订阅定位
    reasoning: 恢复按原订阅中的重新上架活动确定实例；证明角色不成为独立写入资源。
  - id: decision.contract-list-party-root
    category: navigation
    statement: Contract 列表读取以具体 Participant Party 类型为 URL 根
    reasoning: 一份 Contract 绑定双方角色，列表必须先按具体主体收敛，避免把不同主体的合同混入全局集合。
    sourceRefs:
      - source.party-contract-list
nonApiActivities:
  - entityRef: confirmation.mobile
    handling: external
    basis:
      fmRefs:
        - confirmation.mobile
      reasoning: 移动支付机构交付并负责其协议、扣款请求和实际扣款证明；本平台核验既有凭证，不代替机构提供接口。
  - entityRef: request.mobile
    handling: external
    basis:
      fmRefs:
        - request.mobile
      reasoning: 移动支付机构交付并负责其协议、扣款请求和实际扣款证明；本平台核验既有凭证，不代替机构提供接口。
  - entityRef: party.user
    handling: internal
    basis:
      fmRefs:
        - party.user
      reasoning: 用户用于跨合同身份绑定，分别扮演各上下文的角色；不提供用户档案管理接口。
  - entityRef: contract.mobile
    handling: external
    basis:
      fmRefs:

        - relation.contract-refund
      reasoning: 用相同合同、读者及请求编号与既有证据引用核验父子归属，不仅凭URI认定。
  - id: binding.caller-refund-reader
    kind: caller_role
    roleRef: role.reader
    scopeResourceRef: resource.refund
    basis:
      fmRefs:
        - request.refund
        - role.reader
      reasoning: 调用者必须是本实例的合同参与方；读者只读本人单据，服务方只处理本机构责任。章节还须核验本人的指定版本访问资格。
  - id: binding.parent-relaunch
    kind: parent_child
    parentResourceRef: resource.subscription

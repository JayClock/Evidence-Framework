  operations:
    - capabilityRef: >-
        capability.register-sales-performance-agreement-tele-sales
      request:
        mediaType: application/json
        fields:
          - name: agreement_id
            schema:
              type: string
            required: true
            origin: reference
            fmAttributeRef: contract.sales-performance#agreement_id
          - name: signed_at
            schema:
              type: string
              format: date-time
            required: true
            origin: reference
            fmAttributeRef: contract.sales-performance#signed_at
        example:
          agreement_id: PERF-2026-Q4-001
          signed_at: '2026-09-25T09:00:00Z'
      responses:
        - status: 201
          description: 记录已达成的电话销售绩效协议；登记动作不替代双方协议事实。
          representationRef: representation.sales-performance-agreement
          headers:
            Location: /sales-performance-agreements/PERF-2026-Q4-001
        - status: 403
          description: 调用者不是本协议实例的电话销售参与方或无代表资格。
          headers: {}
        - status: 409
          description: 同一幂等键对应不同输入，或该协议凭证已经存在。
          headers: {}
        - status: 422
          description: 协议编号、业务达成时刻或参与方实例关联无效。
          headers: {}
      idempotency:
        mode: key
        header: Idempotency-Key
        samePayload: replay
        differentPayload: reject
        reason: 同一次协议登记重试沿用幂等键，避免重复形成协议凭证。
      concurrency:
        mode: none
        reason: 协议凭证只追加不覆盖；重复业务编号由服务端原子约束。
    - capabilityRef: >-

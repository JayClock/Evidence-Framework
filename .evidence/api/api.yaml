        - confirmation.restore
        - role.publisher
      reasoning: 无 participant.party 扮演该责任角色，当前 API 不暴露其写入；形成步骤以非 API 活动回映。
  - entityRef: evidence.discontinuation
    handling: internal
    basis:
      fmRefs:
        - evidence.discontinuation
        - role.publisher
      reasoning: 无 participant.party 扮演该责任角色，当前 API 不暴露其写入；形成步骤以非 API 活动回映。
  - entityRef: evidence.relaunch
    handling: internal
    basis:
      fmRefs:
        - evidence.relaunch
        - role.publisher
      reasoning: 无 participant.party 扮演该责任角色，当前 API 不暴露其写入；形成步骤以非 API 活动回映。
  - entityRef: request.payment
    handling: internal
    basis:
      fmRefs:
        - request.payment
        - role.publisher
      reasoning: 无 participant.party 扮演该责任角色，当前 API 不暴露其写入；形成步骤以非 API 活动回映。
  - entityRef: thing.customer-profile
    handling: internal
    basis:
      fmRefs:
        - thing.customer-profile
        - relation.customer-contact-references-profile
      reasoning: 客户档案作为客户联系记录引用的既有业务标的；当前 FM 未定义档案读取或维护交互，不据此生成档案 CRUD。
resources:
  - id: resource.party-user
    businessName: 用户主体
    entityRef: party.user
    segment: users
    shape: collection
    basis:
      fmRefs:
        - party.user
        - relation.user-as-reader
        - relation.user-as-account-user
      sourceRefs:
        - source.party-contract-list
      decisionRefs:
        - decision.contract-list-party-root
      reasoning: 用户主体是订阅合同和预付费账户合同列表的参与方作用域根。
    identity:
      kind: api_resource_id
      parameter: userId
      decisionRef: decision.identities
  - id: resource.subscription
    businessName: 专栏订阅合同
    entityRef: contract.subscription
    segment: subscriptions
    shape: collection
    basis:
      fmRefs:
        - contract.subscription
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    identity:
      kind: fm_attribute
      parameter: subscriptionId
      attributeRef: contract.subscription#subscription_id
  - id: resource.party-subscriptions
    businessName: 用户专栏订阅合同列表
    entityRef: contract.subscription
    segment: subscriptions
    shape: collection
    parentRef: resource.party-user
    parentBindingRef: binding.party-subscriptions
    basis:
      fmRefs:
        - party.user
        - relation.user-as-reader
        - contract.subscription
      sourceRefs:
        - source.party-contract-list
      decisionRefs:
        - decision.contract-list-party-root
      reasoning: 按用户主体收敛其作为读者参加的订阅合同列表。
    identity:
      kind: fm_attribute
      parameter: subscriptionId
      attributeRef: contract.subscription#subscription_id
    cardinality:
      max: many
      sourceRefs:
        - source.party-contract-list
      reasoning: 列表返回该用户作为读者参加的订阅合同集合。
  - id: resource.account
    businessName: 预付费账户协议
    entityRef: contract.prepaid
    segment: prepaid-accounts
    shape: collection
    basis:
      fmRefs:
        - contract.prepaid
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    identity:
      kind: fm_attribute
      parameter: accountId
      attributeRef: contract.prepaid#agreement_id
  - id: resource.party-accounts
    businessName: 用户预付费账户协议列表
    entityRef: contract.prepaid
    segment: prepaid-accounts
    shape: collection
    parentRef: resource.party-user
    parentBindingRef: binding.party-accounts
    basis:
      fmRefs:
        - party.user
        - relation.user-as-account-user
        - contract.prepaid
      sourceRefs:
        - source.party-contract-list
      decisionRefs:
        - decision.contract-list-party-root
      reasoning: 按用户主体收敛其作为账户使用方参加的预付费账户协议列表。
    identity:
      kind: fm_attribute
      parameter: accountId
      attributeRef: contract.prepaid#agreement_id
    cardinality:
      max: many
      sourceRefs:
        - source.party-contract-list
      reasoning: 列表返回该用户作为账户使用方参加的预付费账户协议集合。
  - id: resource.payment
    businessName: 订阅费支付请求
    entityRef: request.payment
    segment: payment
    shape: singleton
    basis:
      fmRefs:
        - request.payment
        - contract.subscription
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.subscription
    parentBindingRef: binding.parent-payment
    cardinality:
      relationshipRef: relation.contract-payment
    identity:
      kind: parent_scoped
  - id: resource.access
    businessName: 付费内容访问请求
    entityRef: request.access
    segment: accesses
    shape: collection
    basis:
      fmRefs:
        - request.access
        - contract.subscription
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.subscription
    parentBindingRef: binding.parent-access
    cardinality:
      relationshipRef: relation.contract-access
    identity:
      kind: fm_attribute
      parameter: accessId
      attributeRef: request.access#request_id
  - id: resource.refund
    businessName: 断更退款请求
    entityRef: request.refund
    segment: refund
    shape: singleton
    basis:
      fmRefs:
        - request.refund
        - contract.subscription
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.subscription
    parentBindingRef: binding.parent-refund
    cardinality:
      relationshipRef: relation.contract-refund
    identity:
      kind: parent_scoped
  - id: resource.restore
    businessName: 免费恢复请求
    entityRef: request.restore
    segment: restoration
    shape: singleton
    basis:
      fmRefs:
        - request.restore
        - evidence.relaunch
        - relation.restore-basis-first
      reasoning: 同一次重新上架活动下至多一份有效恢复请求；不同活动分别定位。
    parentRef: resource.relaunch
    parentBindingRef: binding.parent-restore
    cardinality:
      relationshipRef: relation.restore-basis-first
    identity:
      kind: parent_scoped
  - id: resource.debit
    businessName: 账户余额抵扣请求
    entityRef: request.prepaid
    segment: debits
    shape: collection
    basis:
      fmRefs:
        - request.prepaid
        - contract.prepaid
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.account
    parentBindingRef: binding.parent-debit
    cardinality:
      relationshipRef: relation.contract-prepaid
    identity:
      kind: fm_attribute
      parameter: debitId
      attributeRef: request.prepaid#request_id
  - id: resource.access-result
    businessName: 内容提供凭证
    entityRef: confirmation.access
    segment: result
    shape: singleton
    basis:
      fmRefs:
        - confirmation.access
        - request.access
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.access
    parentBindingRef: binding.parent-access-result
    cardinality:
      relationshipRef: relation.access-result
    identity:
      kind: parent_scoped
  - id: resource.refund-result
    businessName: 退款到账凭证
    entityRef: confirmation.refund
    segment: result
    shape: singleton
    basis:
      fmRefs:
        - confirmation.refund
        - request.refund
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.refund
    parentBindingRef: binding.parent-refund-result
    cardinality:
      relationshipRef: relation.refund-result
    identity:
      kind: parent_scoped
  - id: resource.restore-result
    businessName: 免费恢复凭证
    entityRef: confirmation.restore
    segment: result
    shape: singleton
    basis:
      fmRefs:
        - confirmation.restore
        - request.restore
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.restore
    parentBindingRef: binding.parent-restore-result
    cardinality:
      relationshipRef: relation.restore-result
    identity:
      kind: parent_scoped
  - id: resource.debit-result
    businessName: 预付费抵扣凭证
    entityRef: confirmation.prepaid
    segment: result
    shape: singleton
    basis:
      fmRefs:
        - confirmation.prepaid
        - request.prepaid
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.debit
    parentBindingRef: binding.parent-debit-result
    cardinality:
      relationshipRef: relation.prepaid-result
    identity:
      kind: parent_scoped
  - id: resource.discontinuation
    businessName: 断更下架记录
    entityRef: evidence.discontinuation
    segment: discontinuations
    shape: collection
    basis:
      fmRefs:
        - evidence.discontinuation
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    identity:
      kind: api_resource_id
      parameter: discontinuationId
      decisionRef: decision.identities
  - id: resource.relaunch
    businessName: 重新上架记录
    entityRef: evidence.relaunch
    segment: relaunches
    shape: collection
    basis:
      fmRefs:
        - evidence.relaunch
        - contract.subscription
      reasoning: 同一原订阅可有多次重新上架活动，每次活动以独立编号定位。
      sourceRefs:
        - source.restore-per-relaunch
    parentRef: resource.subscription
    parentBindingRef: binding.parent-relaunch
    cardinality:
      max: many
      sourceRefs:
        - source.restore-per-relaunch
      reasoning: 同一原订阅允许保存多份重新上架记录，各次形成均有独立身份。
    identity:
      kind: api_resource_id
      parameter: relaunchId
      decisionRef: decision.identities
  - id: resource.column
    businessName: 专栏
    entityRef: thing.column
    segment: columns
    shape: collection
    basis:
      fmRefs:
        - thing.column
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    identity:
      kind: fm_attribute
      parameter: columnId
      attributeRef: thing.column#column_id
  - id: resource.chapter
    businessName: 章节内容
    entityRef: thing.chapter
    segment: chapters
    shape: collection
    basis:
      fmRefs:
        - thing.chapter
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    identity:

          - path: portFailure.fabricatedResultCount
            operator: equals
            expected: 0
          - path: resultRegistrationFailure.partialResultCount
            operator: equals
            expected: 0
      - id: TASK-AC-APP-ARCH-001
        checkRefs: [CHECK-APP-ARCH-001]

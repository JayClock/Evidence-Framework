kind: smart-domain-plan
metadata:
  project: 移动支付订阅主链与电话销售绩效协议
  goal: 交付并验收 US-001 至 US-003 的 local/test 移动支付订阅主链，以及电话销售绩效协议三个追加能力与月度客户联系完成规则。
  authorizationRefs:
    - docs/requirements/scope.md
    - docs/requirements/stories.md
    - .evidence/discovery.md
    - .evidence/fm/crm-assessment.md
  requirementRefs:

strategy:
  procedures:
    - 边界与契约设计
    - 领域行为
    - 持久化适配
    - HTTP 契约
    - 业务旅程验收
  observableOutcomes:
    - 从真实 HTTP、SQL 与领域规则验收绩效协议主链
    - 登记绩效协议与月度目标请求且失败不写入
    - 登记电话/邮件联系记录并计入正确目标与周期
    - 月度目标按总数、电话数和邮件数三项分别判断完成
    - 从真实 HTTP、SQL 和领域规则验收完成与不足旅程
  q2ToQ1:
    - q2: POST 三个能力追加绩效协议、月度目标和联系记录并返回 201/Location
      q1: 领域登记行为、MyBatis 往返与唯一约束、独立 HTTP 输入/错误/导航测试
      context: domain 使用真实对象与内存根集合；persistent 使用真实 H2/MyBatis；api 使用 mock 领域根集合但真实 HTTP/Jersey
    - q2: 月度目标在周期内按总数、电话数、邮件数三项判断完成
      q1: rule.monthly-customer-contact-completed 的领域测试与真实装配重读
      context: 固定 PERF-2026-Q4-001、CONTACT-2026-10 与 3/2/1 目标；领域测试不启动 HTTP/数据库
    - q2: 重复登记、非法关联和幂等重试不产生第二份事实
      q1: 唯一约束与本地事务回滚、幂等键解析、拒绝时不写
      context: H2 只证明 local/test；生产数据库与并发仍受 GAP-DATABASE 阻塞
  functionalContexts:
    - context: domain
      real: SalesPerformanceAgreement、MonthlyCustomerContactTarget、CustomerContactRecord 与角色对象
      standins: 内存根集合/关联 Fake 只证明领域判断与失败不变性
    - context: persistent
      real: H2、Flyway、MyBatis XML、领域对象与真实事务
      standins: 无；不允许 Row/PO 复制层替代领域装配
    - context: api
      real: 随机端口 Jersey、Jackson、HAL/HAL-FORMS 与表示
      standins: mock 领域根集合；不 mock 被测 Resource/序列化器
    - context: app
      real: 真实 HTTP + 真实 SQL + 领域完成规则
      standins: 无外部系统；客户档案与身份保持缺口
  unresolvedDecisions:
    - GAP-IDENTITY
    - GAP-DATABASE
    - GAP-SCOPE-CRM
    - GAP-CRM-PARTICIPATION
    - GAP-CUSTOMER-PROFILE
    - GAP-EVIDENCE-REFS
slicing:
  designItems:
    - id: design.sales-performance-context-foundation
      sourceRefs:
        - context.sales-performance
        - role.performance-manager
        - role.tele-sales
        - relation.user-as-performance-manager
        - relation.user-as-tele-sales
        - party.user
      reason: 绩效协议模块公开 SalesPerformanceContext 与两个角色对象；Users 根集合经进程内契约进入绩效上下文并直接装饰已加载 User，不重读主体，也不把角色当认证凭证或实例参与证明。
    - id: design.sales-performance-domain-contracts
      sourceRefs:
        - context.sales-performance
        - contract.sales-performance
        - request.monthly-customer-contact
        - relation.sales-performance-to-monthly-contact
        - fulfillment.monthly-customer-contact
      reason: 绩效协议模块的根集合、协议与月度目标请求由领域拥有者实现；登记只追加既成事实，目标数按本协议实例约定，不生成未定义的未达标后果。
    - id: design.sales-performance-contact-rule
      sourceRefs:
        - confirmation.customer-contact-record
        - relation.monthly-contact-to-record
        - relation.customer-contact-references-profile
        - rule.monthly-customer-contact-completed
        - thing.customer-profile
      reason: 客户联系记录归月度目标拥有；完成判断按目标周期内匹配记录的总数、电话数和邮件数分别比较；客户档案只以标识引用保存，不建立档案 CRUD。
    - id: design.sales-performance-storage
      sourceRefs:
        - contract.sales-performance
        - request.monthly-customer-contact
        - confirmation.customer-contact-record
        - relation.sales-performance-to-monthly-contact
        - relation.monthly-contact-to-record
      reason: MyBatis/Flyway 适配器唯一拥有绩效协议、月度目标、联系记录和幂等表，以及写入入口与唯一约束；同一模块内的父子校验与追加在各自本地事务中完成，H2 只验证 local/test 行为。
    - id: design.sales-performance-http-contract
      sourceRefs:
        - resource.sales-performance-agreement
        - resource.monthly-customer-contact-target
        - resource.customer-contact-record
        - capability.register-sales-performance-agreement-tele-sales
        - capability.register-monthly-customer-contact-target-manager
        - capability.register-customer-contact-record-tele-sales
      reason: 一条从绩效协议根到月度目标、再到联系记录的 Jersey 子资源链交付三个追加能力；独立 HTTP 测试 mock 领域公开契约，真实身份与 403 保持缺口。
    - id: design.monthly-customer-contact-journey
      sourceRefs:
        - scenario.monthly-customer-contact-completed
        - scenario.monthly-customer-contact-insufficient
        - rule.monthly-customer-contact-completed
      reason: 以真实 HTTP、H2/MyBatis 和领域完成规则验证总数、电话数和邮件数达标、记录不足保持未完成，以及周期边界、幂等与失败不变性。

    - AC-002-04
    - AC-003-01
    - AC-003-02
    - AC-003-03
    - US-001
    - US-002
    - US-003
  nonGoals:
    - 内容访问、退款、恢复、预付费和异常履约
    - 前端
    - 生产身份、生产数据库和真实支付协议

        - 工程基线：`docs/engineering/{procedures,api,security,testing,examples}.md` 和 Jersey 子资源约束。
        - 工序实例：HTTP 契约；真实随机端口、Jersey、Jackson、HAL/HAL-FORMS 和 Pagination，mock 领域根/关联，不 mock Resource/序列化器。

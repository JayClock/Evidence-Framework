strategy:
  procedures:
    - 边界与契约设计
    - 领域行为
    - 持久化适配
    - HTTP 契约
    - 应用装配与模块协作
    - 业务旅程验收
  observableOutcomes:
    - 登记完整订阅合同且失败不写入
    - 从合同确定性派生付款请求
    - 以唯一匹配证明判断 completed/pending
    - 通过约定 HTTP 能力读取合同和付款状态
    - 从真实 HTTP、SQL 和 local/test 支付端口验收主链
  q2ToQ1: []
  functionalContexts: []
  unresolvedDecisions:
    - GAP-IDENTITY
    - GAP-DATABASE
  archiveRef: archive/schema-2/index.md
slicing:
  designItems:
    - id: design.reader-context-foundation
      sourceRefs:
        - party.user
        - role.reader
        - relation.user-as-reader
        - context.subscription
      reason: >-
        复用并复验现有 User -> SubscriptionContext -> Reader 入口和固定技术平台，不重新读取主体、不把角色当认证凭证。
    - id: design.subscription-domain-contracts
      sourceRefs:
        - context.subscription
        - contract.subscription
        - request.payment
        - role.reader
        - role.publisher
        - role.payment-proof
        - relation.contract-payment
        - rule.payment-completed
      reason: 订阅模块公开合同根集合、Reader 行为和 PaymentProof 窄能力；合同与付款规则由领域拥有者实现，不泄漏 Mapper。
    - id: design.mobile-domain-contracts
      sourceRefs:
        - context.mobile
        - request.mobile
        - confirmation.mobile
        - relation.mobile-as-payment-proof
        - rule.mobile-completed
      reason: 移动支付模块保留协议、请求和机构结果事实，并以 confirmation.mobile 适配 PaymentProof，不复制证明。
    - id: design.subscription-payment-storage
      sourceRefs:
        - contract.subscription
        - request.payment
        - request.mobile
        - confirmation.mobile
        - relation.contract-payment
        - relation.mobile-result
      reason: MyBatis/Flyway 适配器分别拥有订阅与移动支付表、幂等和唯一结果约束；H2 只验证 local/test 行为。
    - id: design.local-mobile-payment-adapter
      sourceRefs:
        - request.mobile
        - confirmation.mobile
        - rule.mobile-completed
        - scenario.mobile-subscription
      reason: >-
        local/test 固定使用 PAY-001、MOBILE-001、MOBILE-REQ-001 和 2026-10-01T09:02:00Z 调用确定性支付端口；不扩成生产协议、标识生成、验签、超时、重试或补偿规则。
    - id: design.subscription-http-contract
      sourceRefs:
        - resource.party-user
        - resource.subscription
        - resource.party-subscriptions
        - resource.payment
        - capability.register-subscription-reader
        - capability.list-subscriptions-reader
        - capability.read-subscription-reader
        - capability.read-payment-reader
      reason: >-
        一个从用户主体到订阅列表、并从合同到付款的 Jersey 子资源链交付合同登记/读取/列表和付款读取，独立 HTTP 测试 mock 领域公开契约。
    - id: design.subscription-payment-orchestration
      sourceRefs:
        - contract.subscription
        - request.payment
        - request.mobile
        - confirmation.mobile
        - scenario.mobile-subscription
      reason: >-
        合同登记成功后通过进程内契约自动形成付款请求并调用 local/test 支付端口，结果独立登记；不建立业务 Service 或调用自身 HTTP。
    - id: design.mobile-subscription-journey
      sourceRefs:
        - scenario.mobile-subscription
        - scenario.payment-pending
        - scenario.cutoff-paid
        - capability.register-subscription-reader
        - capability.read-subscription-reader
        - capability.read-payment-reader
      reason: >-
        以真实 HTTP、H2/MyBatis 和 local/test 支付适配器验证 completed、pending、截止边界、404 与失败不变性。

    title: 绩效协议上下文、角色与后端平台基础
    mode: implementation
    status: done
    outcome: 复验后端平台与技术分层，并交付 SalesPerformanceContext 入口、绩效管理者/电话销售角色对象及 Users 根集合的进程内注入证据。
    sourceRefs:
      - party.user
      - context.sales-performance
      - role.performance-manager
      - role.tele-sales
      - relation.user-as-performance-manager
      - relation.user-as-tele-sales
      - design.sales-performance-context-foundation
    ruleRefs: []
    scenarioRefs: []
    storyRefs: []
    acceptanceRefs: []
    sliceRefs:
      - scenario.monthly-customer-contact-completed
      - scenario.monthly-customer-contact-insufficient
    gapRefs: []
    guides:
      items:
        - 项目入口：`AGENTS.md`、`docs/guides/index.md`。
        - 交付目标：`Users.inSalesPerformanceContext()` 返回 `SalesPerformanceContext`，由它把已加载 `User` 装饰成 `PerformanceManager` 或 `TeleSales`。
        - 非目标：不实现协议/目标/联系记录行为，不建立认证或 403，不把角色名当权限凭证或实例参与证明。
        - 业务来源：`party.user`、`context.sales-performance`、两个角色与 `relation.user-as-performance-manager`、`relation.user-as-tele-sales`。
        - 工程基线：`docs/architecture/{overview,modules,domain-mapping}.md`、`docs/engineering/{backend,testing,examples}.md`。
        - 工序实例：边界与契约设计 + 领域行为；真实 `User`/角色对象，领域测试用内存 `Users` Fake 证明不重读主体；persistent 测试证明 Spring 注入；ArchUnit 证明技术分层。
        - 平台基线：固定 Java 17 / Boot 3.5.x / smart-domain 0.3.0 / MyBatis XML / Jersey+HAL；本任务复验构建版本、四个 Gradle 模块与依赖方向，不新增技术栈。
        - 前置产物：无；本任务先于绩效协议领域与接口任务，不继承旧计划证据。
        - 已确认输入：类型级 `plays_role` 关系不证明同一协议实例由同一自然人承担双方；实例参与核验见 GAP-CRM-PARTICIPATION。
      freshnessRisks:
        - 本计划由当前绩效协议 FM/API 重新编译；执行前仍须按当前 Guides 重新核对来源、代码与环境。
        - FM/API 在本计划重建后仅保留绩效协议模型；本任务只消费上列源 ID，不继承已删除订阅主链的旧证据。
    design:
      behaviorOwner: context.sales-performance 声明接口；具体角色对象与 Context 实现由本任务创建
      businessModule: 绩效协议模块（sales-performance）：domain 公开 `Users.inSalesPerformanceContext()`、`SalesPerformanceContext`、`PerformanceManager`、`TeleSales`；persistent 提供独立 Context 实现，不向其他模块泄漏内部类。
      technicalLibraries:
        - smart-domain Core
        - Spring 依赖注入（仅适配层与组合根）
        - MyBatis Starter（persistent 适配器）
        - Jersey/HAL/HAL-FORMS（api 与组合根）
      dataOwnership: 本任务不新增表或迁移；用户主体仍归 Users 适配器。
      associations: 角色对象直接装饰传入的已加载 User；`asRole` 不重新读取主体。
      http: 不适用；HTTP 导航与能力见 api 任务。
      rolesAndRules: '`asPerformanceManager`/`asTeleSales` 只做上下文与角色切换；角色名不是认证证据，实例参与与代表权限受 GAP-IDENTITY/GAP-CRM-PARTICIPATION 阻塞。'
      localTransaction: 不适用；本任务不写业务表。
      externalIntegration: 无已确认远程依赖。
      nonGoals:
        - 认证与 403
        - 协议实例参与方核验
        - 绩效协议业务行为
    procedureRefs:
      - docs/engineering/procedures.md
      - docs/engineering/testing.md
      - docs/engineering/backend.md
      - docs/engineering/examples.md
    dependencyUsage: []
    files:
      create:
        - libs/backend/domain/src/main/java/com/evidencepoc/backend/domain/context/SalesPerformanceContext.java
        - libs/backend/domain/src/main/java/com/evidencepoc/backend/domain/role/PerformanceManager.java
        - libs/backend/domain/src/main/java/com/evidencepoc/backend/domain/role/TeleSales.java
        - libs/backend/persistent/src/main/java/com/evidencepoc/backend/persistent/context/SalesPerformanceContext.java
        - libs/backend/domain/src/test/java/com/evidencepoc/backend/domain/SalesPerformanceRoleTests.java
      modify:
        - libs/backend/domain/src/main/java/com/evidencepoc/backend/domain/model/Users.java
        - libs/backend/persistent/src/main/java/com/evidencepoc/backend/persistent/associations/Users.java
        - libs/backend/persistent/src/test/java/com/evidencepoc/backend/persistent/MyBatisUsersTests.java
      reuse:
        - libs/backend/domain/src/main/java/com/evidencepoc/backend/domain/model/User.java
        - libs/backend/domain/src/main/java/com/evidencepoc/backend/domain/description/UserDescription.java
        - libs/backend/persistent/src/main/java/com/evidencepoc/backend/persistent/context/SubscriptionContext.java
        - libs/backend/domain/src/test/java/com/evidencepoc/backend/domain/ReaderTests.java
        - apps/backend/src/test/java/com/evidencepoc/backend/BackendArchitectureTests.java
    steps:
      - 在 domain 声明 `SalesPerformanceContext` 并创建 `PerformanceManager`、`TeleSales`，构造器只接受已加载 `User`，缺失主体时拒绝。
      - 核对构建版本、四个 Gradle 模块的依赖方向与固定技术 profile，确认平台基线未被新上下文破坏。
      - 在 `Users` 根集合接口增加 `inSalesPerformanceContext()`，并在 persistent 独立 Context 文件与 `Users` 适配器中完成依赖注入。
      - 在 `MyBatisUsersTests` 增加 Spring 注入与“装饰同一快照、不重读主体”的断言。
      - 运行领域、persistent 与 ArchUnit 定向检查，确认技术分层未被新类破坏。
    checks:
      - id: CHECK-CRM-FND-001
        purpose: 证明 Users → SalesPerformanceContext → 角色对象的切换不重读主体、不铸造新身份。
        quadrant: Q1
        subject: SalesPerformanceContext、PerformanceManager、TeleSales 与内存 Users Fake
        dependencies: 真实 User 与角色类；内存 Users Fake 只证明角色切换不重读主体。
        inputs: user-1 快照（displayName=过期快照）；null 主体；两个角色 id。
        expected: 两个角色分别返回 role.performance-manager / role.tele-sales 和原 actor 快照；findByIdentity 不被调用；null 主体被拒绝。
        testFiles:
          - libs/backend/domain/src/test/java/com/evidencepoc/backend/domain/SalesPerformanceRoleTests.java
        cwd: .
        command: ./gradlew :backend-domain:test --tests com.evidencepoc.backend.domain.SalesPerformanceRoleTests --rerun-tasks
        procedure: docs/engineering/testing.md
        preparationTaskRefs: []
        gapRefs: []
        evidenceRequired: 命令、退出码、断言覆盖与 Fake 调用记录。
      - id: CHECK-CRM-FND-002
        purpose: 证明 persistent 适配器经 Spring 注入同一 SalesPerformanceContext 并直接装饰给定 User。
        quadrant: Q1
        subject: persistent 的 SalesPerformanceContext 实现与 Users 适配器
        dependencies: 真实 Spring/H2/MyBatis 装配。
        inputs: 已创建的 User 与注入的 SalesPerformanceContext bean。
        expected: 注入同一 bean；两个角色对象装饰传入快照；不因切换角色重读数据库。
        testFiles:
          - libs/backend/persistent/src/test/java/com/evidencepoc/backend/persistent/MyBatisUsersTests.java
        cwd: .
        command: ./gradlew :backend-persistent:test --tests com.evidencepoc.backend.persistent.MyBatisUsersTests.salesPerformanceContextIsInjectedAndDecoratesTheGivenUser --rerun-tasks
        procedure: docs/engineering/testing.md
        preparationTaskRefs: []
        gapRefs: []
        evidenceRequired: 命令、退出码与注入/装饰断言结果。
      - id: CHECK-CRM-FND-003
        purpose: 回归技术分层与模块可见性约束。
        quadrant: Q1
        subject: BackendArchitectureTests 的 domain/api/persistent 禁止依赖规则
        dependencies: 真实编译产物与 ArchUnit。
        inputs: 当前 Java 源码。
        expected: 既有规则全部通过；新上下文与角色类没有让 domain 依赖 Spring/MyBatis/Jersey。
        testFiles:
          - apps/backend/src/test/java/com/evidencepoc/backend/BackendArchitectureTests.java
        cwd: .
        command: ./gradlew :backend:test --tests com.evidencepoc.backend.BackendArchitectureTests --rerun-tasks
        procedure: docs/engineering/testing.md
        preparationTaskRefs: []
        gapRefs: []
        evidenceRequired: 命令、退出码与规则通过数。

        - >-
          交付目标：实现 `POST /sales-performance-agreements`、`POST /sales-performance-agreements/{agreementId}/monthly-customer-contact-targets`、`POST
          .../{targetId}/contact-records` 的 201/Location/self、no-store、幂等与错误映射。
        - 非目标：不实现读取/列表能力（API 未定义）、不实现真实认证与 403、不访问 persistent/app/数据库、不解析任意 evidenceRefs。
        - >-
          业务/API 来源：`.evidence/api/api.json` 中三个 capability 与三个 resource；请求/响应与示例取自 `http.operations`、`http.representations`、`http-journey`
          与合成向量。
        - 工程基线：`docs/engineering/{procedures,api,security,testing,examples}.md`。
        - 工序实例：HTTP 契约；真实随机端口、Jersey、Jackson、HAL/HAL-FORMS，mock 领域公开契约，不 mock 被测 Resource/序列化器。
        - 前置产物：绩效上下文/角色骨架、协议与目标领域行为、记录与完成规则领域契约。
        - >-
          已确认输入：合成场景值 PERF-2026-Q4-001、CONTACT-2026-10、CUSTOMER-001/002/003 与 3/2/1；GAP-IDENTITY/GAP-CRM-PARTICIPATION
          阻塞 403 与参与方核验，GAP-EVIDENCE-REFS 阻塞任意凭证引用解析。
      freshnessRisks:
        - 本计划由当前绩效协议 FM/API 重新编译；执行前仍须按当前 Guides 重新核对来源、代码与环境。
        - FM/API 在本计划重建后仅保留绩效协议模型；本任务只消费上列源 ID，不继承已删除订阅主链的旧证据。
    design:
      behaviorOwner: Resource 只解析输入、调用领域公开契约并转换结果；业务规则留在领域拥有者
      businessModule: api 模块消费绩效协议模块公开的根集合与实体契约，不接触 Mapper、表或 persistent 包。
      technicalLibraries:
        - Jersey
        - Spring HATEOAS/HAL/HAL-FORMS
        - Jackson
      dataOwnership: 不适用；本任务不直接访问数据库。
      associations: >-
        子资源链：RootApi → SalesPerformanceAgreementsApi → SalesPerformanceAgreementApi → MonthlyCustomerContactTargetsApi
        → MonthlyCustomerContactTargetApi → CustomerContactRecordsApi；手工子资源统一经 ResourceContext 初始化。
      http: >-
        POST 返回 201、Location 与 self；同键同输入重放原结果，同键不同输入与已存在业务编号返回 409；字段/关联无效返回 422，非法 JSON/未知字段/类型错误返回
        400；响应 no-store。
      rolesAndRules: 角色绑定与参与方核验在本地无身份来源时不可执行；Resource 按领域公开契约追加凭证，403 保持缺口，不以角色名猜测调用者。
      localTransaction: 不适用；写入事务归 persistent 适配器。
      idempotency: >-
        api 依赖 domain 的 IdempotencyLedger 端口；persistent 根适配器实现并保存能力、键、摘要与结果标识；同键异摘要抛 IdempotencyKeyReuseException，同键同摘要重放已记录资源。
      externalIntegration: 无。
      nonGoals:

        - 交付目标：让真实 Resource、领域公开契约、持久化适配器和 local/test 支付端口在 app 中可用；明确付款触发与事务分段。
        - 非目标：组合根不实现业务 Service，不直接访问 Mapper/表，不把外部调用放入数据库事务，不接真实支付。
        - >-
          工程来源：`docs/architecture/{overview,modules}.md`、`docs/engineering/{procedures,backend,security,testing,examples}.md`。
        - >-
          工序实例：应用装配与模块协作；真实领域、persistent 和 HTTP；local/test Stub 替代外部机构。Q1 装配/架构检查支撑主链 Q2。
        - 前置产物：真实订阅/移动持久化、local 支付端口和订阅 API。
        - >-
          已确认输入：合同登记成功后自动形成付款请求并进入 local/test 扣款调用；固定使用 `PAY-001`、`MOBILE-001`、`MOBILE-REQ-001` 和移动请求业务开始时间
          `09:02`。
      freshnessRisks:
        - 迁移保留的是历史任务前馈；执行前仍须按当前 Guides 重新核对来源、代码与环境。
    design:
      archiveRef: archive/schema-2/tasks/订阅支付应用装配与模块协作.md
      decisions:
        - app 只扫描/配置 Bean；实际业务流程由 Reader/合同拥有者关联和 Context 注入的公开端口表达。
        - 合同 11 字段和付款请求在合同登记事务中形成；合同登记成功后自动调用支付端口，结果在独立事务中幂等登记。本地事务不声称回滚支付端口副作用。
        - 模块协作走 Java 契约，禁止订阅包访问移动支付 Mapper 或反向访问订阅私有表。
        - local/test profile 注册模拟器；正式 profile 在无真实端口时启动/能力暴露策略须按当前范围保持隔离。
    procedureRefs:
      - docs/engineering/procedures.md
      - docs/engineering/testing.md
      - docs/engineering/backend.md
      - docs/engineering/security.md
      - docs/engineering/examples.md
    dependencyUsage:
      - taskRef: mybatis::context.subscription::design.subscription-payment-storage
        consumes: 真实合同、请求、结果关联适配器和事务入口。
        readinessEvidence: CHECK-SQL-SUB-001、CHECK-SQL-MOBILE-001。
      - taskRef: integration::context.mobile::design.local-mobile-payment-adapter
        consumes: local/test MobilePaymentPort Stub。
        readinessEvidence: CHECK-LOCALPAY-001。
      - taskRef: api::context.subscription::capability.register-subscription-reader
        consumes: 已确定的 Jersey Resource、表示和领域调用边界。
        readinessEvidence: CHECK-API-SUB-001、CHECK-API-PAY-001。
    files:
      create:
        - >-
          apps/backend/src/test/java/com/evidencepoc/backend/subscription/SubscriptionAssemblyTests.java
      modify:
        - >-
          apps/backend/src/main/java/com/evidencepoc/backend/BackendApplication.java
        - >-
          apps/backend/src/main/java/com/evidencepoc/backend/config/JerseyConfiguration.java
        - >-
          apps/backend/src/test/java/com/evidencepoc/backend/BackendArchitectureTests.java
        - apps/backend/src/test/resources/application-test.properties
      reuse:
        - >-
          apps/backend/src/test/java/com/evidencepoc/backend/user/UserApiTests.java
        - >-
          libs/backend/persistent/src/main/java/com/evidencepoc/backend/persistent/context/SubscriptionContext.java
    steps:
      - 把公开领域契约、适配器、Resource 和 local/test 端口接入组合根，在合同登记成功路径自动形成付款请求并调用支付端口。
      - 明确并测试合同/请求事务、端口调用、结果登记事务的顺序和失败边界。
      - 扩展架构测试，禁止业务模块访问彼此 Mapper/内部包及 app 承接业务规则。
      - 通过真实 HTTP + SQL 验证 Bean 接线、profile 隔离和失败后的数据状态。
    checks:
      - id: CHECK-APP-WIRE-001
        purpose: 证明统一应用通过公开契约完成真实装配与分段事务。
        quadrant: Q1
        subject: Jersey -> Reader/Subscriptions -> MyBatis -> MobilePaymentPort -> 结果登记
        dependencies: 真实 Spring/Jersey/H2/MyBatis；local/test 支付 Stub，无网络。
        inputs: >-
          包含 11 字段的固定合同；系统自动形成 PAY-001，并以 MOBILE-001/MOBILE-REQ-001/09:02 调用固定成功结果；端口抛错和结果登记抛错两种故障。
        expected: 正常链路可经 HTTP/SQL观察；端口失败不伪造结果；结果登记失败不产生部分结果；外部调用不位于数据库事务回滚承诺内。
        testFiles:
          - >-
            apps/backend/src/test/java/com/evidencepoc/backend/subscription/SubscriptionAssemblyTests.java
        cwd: .
        command: >-
          ./gradlew :backend:test --tests com.evidencepoc.backend.subscription.SubscriptionAssemblyTests
          --rerun-tasks
        procedure: docs/engineering/testing.md
        preparationTaskRefs:
          - mybatis::context.subscription::design.subscription-payment-storage
          - integration::context.mobile::design.local-mobile-payment-adapter
          - api::context.subscription::capability.register-subscription-reader
        gapRefs: []
        evidenceRequired: 命令、退出码、真实 HTTP/SQL、Stub 调用和故障后数据摘要。
      - id: CHECK-APP-ARCH-001
        purpose: 证明新增业务模块只通过公开契约协作。
        quadrant: Q4
        subject: 技术分层、业务包和数据所有权依赖规则
        dependencies: ArchUnit 扫描生产类。
        inputs: 当前 backend classpath 和新增订阅/移动支付包。
        expected: domain 无技术依赖；api 不访问 persistent；订阅/移动支付互不访问对方 Mapper/内部包；app 无业务规则类。
        testFiles:
          - >-
            apps/backend/src/test/java/com/evidencepoc/backend/BackendArchitectureTests.java
        cwd: .
        command: >-
          ./gradlew :backend:test --tests com.evidencepoc.backend.BackendArchitectureTests --rerun-tasks
        procedure: docs/engineering/testing.md
        preparationTaskRefs:
          - mybatis::context.subscription::design.subscription-payment-storage
          - integration::context.mobile::design.local-mobile-payment-adapter
          - api::context.subscription::capability.register-subscription-reader
        gapRefs: []
        evidenceRequired: 命令、退出码和新增架构规则摘要。
    acceptanceCriteria:
      - id: TASK-AC-APP-WIRE-001
        checkRefs: [CHECK-APP-WIRE-001]
        assertions:
          - path: registeredSubscription.paymentRequestId
            operator: equals
            expected: PAY-001
          - path: paymentPort.protocolId
            operator: equals
            expected: MOBILE-001
          - path: paymentPort.requestId
            operator: equals
            expected: MOBILE-REQ-001
          - path: paymentPort.startedAt

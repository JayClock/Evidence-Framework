      - id: TASK-AC-CRM-FND-001
        checkRefs:
          - CHECK-CRM-FND-001
          - CHECK-CRM-FND-002
          - CHECK-CRM-FND-003
        assertions:
          - path: teleSales.roleId
            operator: equals
            expected: role.tele-sales
          - path: performanceManager.roleId
            operator: equals
            expected: role.performance-manager
          - path: role.actor.reusedSnapshot

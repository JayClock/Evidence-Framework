    - AC-001-02
    - AC-002-01
    - AC-002-02
    - AC-002-03
    - AC-002-04
    - AC-003-01
    - AC-003-02
    - AC-003-03
    - US-001
    - US-002
    - US-003
    - docs/requirements/scope.md
    - docs/requirements/stories.md
  nonGoals:
    - 内容访问、退款、恢复、预付费和异常履约
    - 前端
    - 生产身份、生产数据库和真实支付协议
    - 绩效协议的参与方实例核验与未达标后果
    - 客户档案生命周期、读取/维护接口与周度进度检查
    - 生产身份与生产数据库

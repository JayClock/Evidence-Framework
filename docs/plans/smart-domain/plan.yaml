        - 非目标：不验收真实身份/403、生产数据库、客户档案、未达标后果、周度进度检查与前端。
        - >-
          业务来源：`scenario.monthly-customer-contact-completed`、`scenario.monthly-customer-contact-insufficient`
          与 `rule.monthly-customer-contact-completed`；请求/响应取自 API `http-journey` 与合成向量（runtimeValidated=false）。
        - >-
          工程基线：`docs/engineering/{procedures,testing,backend,examples}.md`、`apps/backend/src/test/java/com/evidencepoc/backend/user/UserApiTests.java`。
        - 工序实例：业务旅程验收 + 应用装配与模块协作；真实 app/Jersey/H2/MyBatis/Flyway 与领域规则，无外部系统替身。
        - 前置产物：绩效协议持久化与三个 HTTP 能力。
        - 已确认输入：API 合成向量只作确定性请求/预期模板；完成规则不写入 HTTP 表示，由领域规则在重读后判断。
      freshnessRisks:
        - 本计划由当前绩效协议 FM/API 重新编译；执行前仍须按当前 Guides 重新核对来源、代码与环境。
        - FM/API 在本计划重建后仅保留绩效协议模型；本任务只消费上列源 ID，不继承已删除订阅主链的旧证据。
    design:
      behaviorOwner: 验收只观察真实 HTTP 结果、SQL 原始事实与领域规则结果；不改写业务预期
      businessModule: 组合根装配真实 Resource、领域公开契约与 persistent 适配器；不在 app 新建业务 Service。
      technicalLibraries:
        - Spring Boot
        - Jersey
        - MyBatis
        - Flyway
        - H2（local/test）
      dataOwnership: 验证 SQL 行数与关键字段；表仍归 persistent 适配器。
      associations: 验证协议→目标→记录的父子关系经真实 HTTP 写入后可由领域重读。
      http: 真实随机端口 HTTP；验收 201、Location/self 与 no-store，不把 201 当完成。
      rolesAndRules: 完成状态由 `rule.monthly-customer-contact-completed` 计算；无身份来源，403 与参与方核验保持缺口。
      localTransaction: 每个写入步骤独立本地事务；失败不留下部分事实，跨步骤不回滚已登记凭证。
      externalIntegration: 无。
      nonGoals:
        - 真实身份与 403
        - 生产数据库/并发
        - 客户档案与未达标后果

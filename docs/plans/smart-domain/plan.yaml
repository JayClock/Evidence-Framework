        - 请求使用可写 Bean，领域 Description 保持不可变；未知字段/非法 JSON/类型错误严格拒绝。
        - POST 要求 `Idempotency-Key`，返回 201、Location 和 self；同键冲突映射 409，业务字段失败映射 422。
        - '读取返回 `Cache-Control: no-store`；付款请求不存在映射 404；状态来自领域，不以资源存在代替完成。'

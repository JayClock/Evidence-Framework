            expected: []
          - path: architecture.apiPersistentAccessViolations
            operator: equals
            expected: []
          - path: architecture.crossModuleMapperAccessViolations
            operator: equals
            expected: []
          - path: profiles.default.localPaymentStubBeanCount
            operator: equals
            expected: 0
    observedEvidence: []
    executionDiscipline:
      - 若事务参与者或触发点变化，返回 Plan；不得在组合根新增业务 Service 来绕过领域拥有者。

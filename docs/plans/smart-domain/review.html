a5e2d7ef045b621ef8b36f844b36\n    sourceRefs:\n      - context.sales-performance\n      - thing.customer-profile\n    purpose: 电话销售绩效协议切片的说明、术语与纳入判断；不构成软件范围批准。\n  - path: .evidence/fm/01-glossary.md\n    digest: 8b24a32e3a633bf64c0b4746d9a09f87228502e1fef530433fa88cdb3a60f473\n    sourceRefs:\n      - context.sales-performance\n      - thing.customer-profile\n    purpose: 电话销售绩效协议切片的说明、术语与纳入判断；不构成软件范围批准。\nstrategy:\n  procedures:\n    - 边界与契约设计\n    - 领域行为\n    - 持久化适配\n    - HTTP 契约\n    - 应用装配与模块协作\n    - 业务旅程验收\n  observableOutcomes:\n    - 登记完整订阅合同且失败不写入\n    - 从合同确定性派生付款请求\n    - 以唯一匹配证明判断 completed/pending\n    - 通过约定 HTTP 能力读取合同和付款状态\n    - 从真实 HTTP、SQL 和 local/test 支付端口验收主链\n    - 登记绩效协议与月度目标请求且失败不写入\n    - 登记电话/邮件联系记录并计入正确目标与周期\n    - 月度目标按总数、电话数和邮件数三项分别判断完成\n    - 从真实 HTTP、SQL 和领域规则验收完成与不足旅程\n    - 从真实 HTTP、SQL 与领域规则验收绩效协议主链\n  q2ToQ1:\n    - q2: POST 三个能力追加绩效协议、月度目标和联系记录并返回 201/Location\n      q1: 领域登记行为、MyBatis 往返与唯一约束、独立 HTTP 输入/错误/导航测试\n      context: domain 使用真实对象与内存根集合；persistent 使用真实 H2/MyBatis；api 使用 mock 领域根集合但真实 HTTP/Jersey\n    - q2: 月度目标在周期内按总数、电话数、邮件数三项判断完成\n      q1: rule.monthly-customer-contact-completed 的领域测试与真实装配重读\n      context: 固定 PERF-2026-Q4-001、CONTACT-2026-10 与 3/2/1 目标；领域测试不启动 HTTP/数据库\n    - q2: 重复登记、非法关联和幂等重试不产生第二份事实\n      q1: 唯一约束与本地事务回滚、幂等键解析、拒绝时不写\n      context: H2 只证明 local/test；生产数据库与并发仍受 GAP-DATABASE 阻塞\n  functionalContexts:\n    - context: domain\n      real: SalesPerformanceAgreement、MonthlyCustomerContactTarget、CustomerContactRecord 与角色对象\n      standins: 内存根集合/关联 Fake 只证明领域判断与失败不变性\n    - context: persistent\n      real: H2、Flyway、MyBatis XML、领域对象与真实事务\n      standins: 无；不允许 Row/PO 复制层替代领域装配\n    - context: api\n      real: 随机端口 Jersey、Jackson、HAL/HAL-FORMS 与表示\n      standins: mock 领域根集合；不 mock 被测 Resource/序列化器\n    - context: app\n      real: 真实 HTTP + 真实 SQL + 领域完成规则\n      standins: 无外部系统；客户档案与身份保持缺口\n  unresolvedDecisions:\n    - GAP-IDENTITY\n    - GAP-DATABASE\n    - GAP-SCOPE-CRM\n    - GAP-CRM-PARTICIPATION\n    - GAP-CUSTOMER-PROFILE\n    - GAP-EVIDENCE-REFS\n  archiveRef: archive/schema-2/index.md\nslicing:\n  designItems:\n    - id: design.reader-context-foundation\n      sourceRefs:\n        - party.user\n        - role.reader\n        - relation.user-as-reader\n        - context.subscription\n      reason: 复用并复验现有 User -\u003e SubscriptionContext -\u003e Reader 入口和固定技术平台，不重新读取主体、不把角色当认证凭证。\n    - id: design.subscription-domain-contracts\n      sourceRefs:\n        - context.subscription\n        - contract.subscription\n        - request.payment\n        - role.reader\n        - role.publisher\n        - role.payment-proof\n        - relation.contract-payment\n        - rule.payment-completed\n      reason: 订阅模块公开合同根集合、Reader 行为和 PaymentProof 窄能力；合同与付款规则由领域拥有者实现，不泄漏 Mapper。\n    - id: design.mobile-domain-contracts\n      sourceRefs:\n        - context.mobile\n        - request.mobile\n        - confirmation.mobile\n        - relation.mobile-as-payment-proof\n        - rule.mobile-completed\n      reason: 移动支付模块保留协议、请求和机构结果事实，并以 confirmation.mobile 适配 PaymentProof，不复制证明。\n    - id: design.subscription-payment-storage\n      sourceRefs:\n        - contract.subscription\n        - request.payment\n        - request.mobile\n        - confirmation.mobile\n        - relation.contract-payment\n        - relation.mobile-result\n      reason: MyBatis/Flyway 适配器分别拥有订阅与移动支付表、幂等和唯一结果约束；H2 只验证 local/test 行为。\n    - id: design.local-mobile-payment-adapter\n      sourceRefs:\n        - request.mobile\n        - confirmation.mobile\n        - rule.mobile-completed\n        - scenario.mobile-subscription\n      reason: \u003e-\n        local/test 固定使用 PAY-001、MOBILE-001、MOBILE-REQ-001 和 2026-10-01T09:02:00Z 调用确定性支付端口；不扩成生产协议、标识生成、验签、超时、重试或补偿规则。\n    - id: design.subscription-http-contract\n      sourceRefs:\n        - resource.party-user\n        - resource.subscription\n        - resource.party-subscriptions\n        - resource.payment\n        - capability.register-subscription-reader\n        - capability.list-subscriptions-reader\n        - capability.read-subscription-reader\n        - capability.read-payment-reader\n      reason: 一个从用户主体到订阅列表、并从合同到付款的 Jersey 子资源链交付合同登记/读取/列表和付款读取，独立 HTTP 测试 mock 领域公开契约。\n    - id: design.subscription-payment-orchestration\n      sourceRefs:\n        - contract.subscription\n        - request.payment\n        - request.mobile\n        - confirmation.mobile\n        - scenario.mobile-subscription\n      reason: 合同登记成功后通过进程内契约自动形成付款请求并调用 local/test 支付端口，结果独立登记；不建立业务 Service 或调用自身 HTTP。\n    - id: design.mobile-subscription-journey\n      sourceRefs:\n        - scenario.mobile-subscription\n        - scenario.payment-pending\n        - scenario.cutoff-paid\n        - capability.register-subscription-reader\n        - capability.read-subscription-reader\n        - capability.read-payment-reader\n      reason: 以真实 HTTP、H2/MyBatis 和 local/test 支付适配器验证 completed、pending、截止边界、404 与失败不变性。\n    - id: design.sales-performance-context-foundation\n      sourceRefs:\n        - context.sales-performance\n        - role.performance-manager\n        - role.tele-sales\n        - relation.user-as-performance-manager\n        - relation.user-as-tele-sales\n        - party.user\n      reason: \u003e-\n        绩效协议模块公开 SalesPerformanceContext 与两个角色对象；Users 根集合经进程内契约进入绩效上下文并直接装饰已加载 User，不重读主体，也不把角色当认证凭证或实例参与证明。\n    - id: design.sales-performance-domain-contracts\n      sourceRefs:\n        - context.sales-performance\n        - contract.sales-performance\n        - request.monthly-customer-contact\n        - relation.sales-performance-to-monthly-contact\n        - fulfillment.monthly-customer-contact\n      reason: 绩效协议模块的根集合、协议与月度目标请求由领域拥有者实现；登记只追加既成事实，目标数按本协议实例约定，不生成未定义的未达标后果。\n    - id: design.sales-performance-contact-rule\n      sourceRefs:\n        - confirmation.customer-contact-record\n        - relation.monthly-contact-to-record\n        - relation.customer-contact-references-profile\n        - rule.monthly-custom     article.append(
      element('h3', gap.id || ''),
      element('div', gap.statement || ''),
      element('p', `Impact: ${gap.impact || ''}
Next: ${gap.nextAction || ''}`, 'muted'),
      element('div', (gap.affectedTaskRefs || []).join(', '), 'key'),
    );
    gaps.append(article);
  });
}
$('#sources').append(pre(data.sourceManifest || []));
$('#strategy').append(pre(data.strategy || {}));
$('#raw').textContent = data.raw;
const requestedView = location.hash.slice(1);
if (['overview', 'dag', 'tasks', 'gaps', 'sources-view', 'raw-view'].includes(requestedView)) {
  navigate(requestedView);
  requestAnimationFrame(() => window.scrollTo(0, 0));
}</script></body></html>

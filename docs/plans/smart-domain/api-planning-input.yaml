# API 规划投影：移动支付订阅主链与电话销售绩效协议
# 权威契约仍为 .evidence/api/api.yaml；本文件只保存任务编译所需的能力边界。
---
schemaVersion: '4.0'
id: api.column-subscription.mobile-payment-subscription-planning
planningProjection:
  purpose: smart-domain implementation planning input
  canonicalApi:
    path: .evidence/api/api.yaml
    sha256: 6e153207908bff6688a59bbe010e301562152887f1d4d2c90341b5803e7c8686
  authorization:
    sourcePaths:
      - docs/requirements/scope.md
      - docs/requirements/stories.md
      - .evidence/discovery.md
    capabilityRefs:
      - capability.register-subscription-reader
      - capability.list-subscriptions-reader
      - capability.read-subscription-reader
      - capability.read-payment-reader
      - capability.register-sales-performance-agreement-tele-sales
      - capability.register-monthly-customer-contact-target-manager
      - capability.register-customer-contact-record-tele-sales
    pendingRequirementsRefs:
      - GAP-SCOPE-CRM
  constraints:
    - >-
      This projection is an input boundary for the current implementation
      plan, not a replacement for the canonical API design.
    - >-
      Resource and capability fields retain the canonical API values needed by
      the task compiler.
    - >-
      Capabilities absent from this projection are outside the authorized
      plan, not removed from the canonical API.
    - >-
      Sales-performance capabilities enter by the current user planning
      instruction; docs/requirements has not yet converged this slice, so the
      plan records GAP-SCOPE-CRM and does not treat the projection as
      approval.
resources:
  - id: resource.party-user
    businessName: 用户主体
    entityRef: party.user
    segment: users
    shape: collection
    basis:
      fmRefs:
        - party.user
        - relation.user-as-reader
      reasoning: 用户主体是本次订阅合同列表的参与方作用域根。
    identity:
      kind: api_resource_id
      parameter: userId
  - id: resource.subscription
    businessName: 专栏订阅合同
    entityRef: contract.subscription
    segment: subscriptions
    shape: collection
    basis:
      fmRefs:
        - contract.subscription
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    identity:
      kind: fm_attribute
      parameter: subscriptionId
      attributeRef: contract.subscription#subscription_id
  - id: resource.party-subscriptions
    businessName: 用户专栏订阅合同列表
    entityRef: contract.subscription
    segment: subscriptions
    shape: collection
    parentRef: resource.party-user
    basis:
      fmRefs:
        - party.user
        - relation.user-as-reader
        - contract.subscription
      reasoning: 按用户主体收敛其作为读者参加的订阅合同列表。
    identity:
      kind: fm_attribute
      parameter: subscriptionId
      attributeRef: contract.subscription#subscription_id
    cardinality:
      max: many
      reasoning: 列表返回该用户作为读者参加的订阅合同集合。
  - id: resource.payment
    businessName: 订阅费支付请求
    entityRef: request.payment
    segment: payment
    shape: singleton
    basis:
      fmRefs:
        - request.payment
        - contract.subscription
      reasoning: 以业务编号和本人参与的合同确定实例；业务凭证仅追加。
    parentRef: resource.subscription
    cardinality:
      relationshipRef: relation.contract-payment
    identity:
      kind: parent_scoped
  - id: resource.sales-performance-agreement
    businessName: 电话销售绩效协议
    entityRef: contract.sales-performance
    segment: sales-performance-agreements
    shape: collection
    basis:
      fmRefs:
        - contract.sales-performance
        - role.tele-sales
      reasoning: 电话销售按场景登记双方已经达成的绩效协议；登记不替代双方达成协议的业务事实。
    identity:
      kind: fm_attribute
      parameter: agreementId
      attributeRef: contract.sales-performance#agreement_id
  - id: resource.monthly-customer-contact-target
    businessName: 月度客户联系目标请求
    entityRef: request.monthly-customer-contact
    segment: monthly-customer-contact-targets
    shape: collection
    parentRef: resource.sales-performance-agreement
    parentBindingRef: binding.parent-monthly-customer-contact-target
    cardinality:
      relationshipRef: relation.sales-performance-to-monthly-contact
    basis:
      fmRefs:
        - contract.sales-performance
        - request.monthly-customer-contact
        - relation.sales-performance-to-monthly-contact
      reasoning: 同一绩效协议可在多个业务周期形成目标请求，每份请求以自身编号定位。
    identity:
      kind: fm_attribute
      parameter: targetId
      attributeRef: request.monthly-customer-contact#request_id
  - id: resource.customer-contact-record
    businessName: 客户联系记录
    entityRef: confirmation.customer-contact-record
    segment: contact-records
    shape: collection
    parentRef: resource.monthly-customer-contact-target
    parentBindingRef: binding.parent-customer-contact-record
    cardinality:
      relationshipRef: relation.monthly-contact-to-record
    basis:
      fmRefs:
        - request.monthly-customer-contact
        - confirmation.customer-contact-record
        - relation.monthly-contact-to-record
        - relation.customer-contact-references-profile
      reasoning: 每份月度目标可形成多份实际联系记录，记录以自身编号定位并引用既有客户档案。
    identity:
      kind: fm_attribute
      parameter: recordId
      attributeRef: confirmation.customer-contact-record#record_id
capabilities:
  - id: capability.register-subscription-reader
    actorRoleRef: role.reader
    resourceRef: resource.subscription
    view: collection
    method: POST
    effect:
      kind: append_evidence
      targetRef: contract.subscription
    businessCapability: 登记专栏订阅合同
    basis:
      fmRefs:
        - contract.subscription
        - role.reader
      reasoning: 追加实际发生的业务记录并核验身份、证据可见性和单据关联，返回登记结果。
  - id: capability.list-subscriptions-reader
    actorRoleRef: role.reader
    resourceRef: resource.party-subscriptions
    view: collection
    method: GET
    effect:
      kind: read
      targetRef: contract.subscription
    businessCapability: 列出本人专栏订阅合同
    basis:
      fmRefs:
        - party.user
        - relation.user-as-reader
        - contract.subscription
      reasoning: 合同列表读取先以用户主体为 URL 根，再返回该主体作为读者参加的订阅合同集合。
  - id: capability.read-subscription-reader
    actorRoleRef: role.reader
    resourceRef: resource.subscription
    view: item
    method: GET
    effect:
      kind: read
      targetRef: contract.subscription
    businessCapability: 读取专栏订阅合同
    basis:
      fmRefs:
        - contract.subscription
        - role.reader
      reasoning: 读取本人的明确业务实例；结果尚未形成返回 404，响应存在不替代完成规则。
  - id: capability.read-payment-reader
    actorRoleRef: role.reader
    resourceRef: resource.payment
    view: singleton
    method: GET
    effect:
      kind: read
      targetRef: request.payment
    businessCapability: 读取订阅费支付请求
    basis:
      fmRefs:
        - request.payment
        - role.reader
      reasoning: 读取本人的明确业务实例；结果尚未形成返回 404，响应存在不替代完成规则。
  - id: capability.register-sales-performance-agreement-tele-sales
    actorRoleRef: role.tele-sales
    resourceRef: resource.sales-performance-agreement
    view: collection
    method: POST
    effect:
      kind: append_evidence
      targetRef: contract.sales-performance
    businessCapability: 登记电话销售绩效协议
    scenarioRefs:
      - scenario.api-monthly-customer-contact-completed
      - scenario.api-monthly-customer-contact-insufficient
    bindingRefs:
      - binding.caller-sales-performance-agreement-tele-sales
    basis:
      fmRefs:
        - contract.sales-performance
        - role.tele-sales
      reasoning: 登记双方已经达成的绩效协议，保留协议业务编号与达成时刻；接口调用不替代协议达成事实。
  - id: capability.register-monthly-customer-contact-target-manager
    actorRoleRef: role.performance-manager
    resourceRef: resource.monthly-customer-contact-target
    view: collection
    method: POST
    effect:
      kind: append_evidence
      targetRef: request.monthly-customer-contact
    businessCapability: 提出月度客户联系目标
    scenarioRefs:
      - scenario.api-monthly-customer-contact-completed
      - scenario.api-monthly-customer-contact-insufficient
    bindingRefs:
      - binding.parent-monthly-customer-contact-target
      - binding.caller-monthly-customer-contact-target-manager
    basis:
      fmRefs:
        - contract.sales-performance
        - request.monthly-customer-contact
        - role.performance-manager
        - relation.sales-performance-to-monthly-contact
      reasoning: 在既有绩效协议下追加本业务周期的目标请求，并核验协议实例、周期和目标值关联。
  - id: capability.register-customer-contact-record-tele-sales
    actorRoleRef: role.tele-sales
    resourceRef: resource.customer-contact-record
    view: collection
    method: POST
    effect:
      kind: append_evidence
      targetRef: confirmation.customer-contact-record
    businessCapability: 登记客户联系记录
    scenarioRefs:
      - scenario.api-monthly-customer-contact-completed
      - scenario.api-monthly-customer-contact-insufficient
    bindingRefs:
      - binding.parent-customer-contact-record
      - binding.caller-customer-contact-record-tele-sales
    basis:
      fmRefs:
        - request.monthly-customer-contact
        - confirmation.customer-contact-record
        - thing.customer-profile
        - relation.monthly-contact-to-record
        - relation.customer-contact-references-profile
      reasoning: 追加一次实际客户联系记录，核验其目标、协议、周期和客户档案引用；是否完成月度目标由完成规则另行判断。

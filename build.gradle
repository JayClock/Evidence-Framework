plugins {
    id 'dev.nx.gradle.project-graph' version '0.1.25' apply false
    id 'org.springframework.boot' version '3.5.9' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'dev.nx.gradle.project-graph'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.evidencepoc'
    version = '0.0.1-SNAPSHOT'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.9'
            mavenBom "io.github.jayclock:smart-domain-bom:${smartDomainVersion}"
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }
    tasks.named('test') { useJUnitPlatform() }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.22.0')
            importOrder()
            removeUnusedImports()
        }
    }
    tasks.named('check') { dependsOn tasks.named('spotlessCheck') }
}

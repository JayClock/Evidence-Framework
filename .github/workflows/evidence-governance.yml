name: Evidence Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-governance-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL: examples/b2b-escrow/model/b2b-escrow.evidence.json
  GENERATED: examples/b2b-escrow/generated
  BOOTSTRAP_MODEL: examples/b2b-escrow/model/b2b-escrow-v1.evidence.json
  NX_DAEMON: 'false'

jobs:
  contract-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:setup
      - run: pnpm nx build cli
      - run: make -C examples/b2b-escrow check tools-test
      - name: Materialize immutable baseline (never fall back after a failed git show)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            if git cat-file -e "${BASE_SHA}:${MODEL}" 2>/dev/null; then
              git show "${BASE_SHA}:${MODEL}" > reports/baseline.evidence.json
            else
              # Explicit bootstrap for the PR that first introduces MODEL.
              git show "${BASE_SHA}:${BOOTSTRAP_MODEL}" > reports/baseline.evidence.json
            fi
          else
            cp "$BOOTSTRAP_MODEL" reports/baseline.evidence.json
          fi
      - name: Breaking contract gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm evidence diff reports/baseline.evidence.json "$MODEL" --format markdown > reports/api-diff.md
      - name: Publish API summary
        if: always()
        run: test ! -f reports/api-diff.md || cat reports/api-diff.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-contract
          path: reports/

  acceptance:
    name: ${{ matrix.implementation }} native + conformance + strict gates
    needs: contract-and-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        implementation: [golang-gin, java-spring, python-fastapi, ts-fastify]
    env:
      IMPLEMENTATION: ${{ matrix.implementation }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        if: matrix.implementation == 'golang-gin'
        with:
          go-version: '1.22.12'
          cache-dependency-path: examples/b2b-escrow/implementations/golang-gin/go.sum
      - uses: actions/setup-java@v4
        if: matrix.implementation == 'java-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: examples/b2b-escrow/implementations/java-spring/pom.xml
      - uses: astral-sh/setup-uv@v6
        if: matrix.implementation == 'python-fastapi'
        with:
          version: '0.9.11'
          enable-cache: true
          cache-dependency-glob: examples/b2b-escrow/implementations/python-fastapi/uv.lock
      - uses: actions/setup-python@v5
        if: matrix.implementation == 'python-fastapi'
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build cli
      - uses: actions/download-artifact@v4
        with:
          name: evidence-contract
          path: reports
      - name: Install, test and build only the selected independent project
        id: build
        shell: bash
        run: |
          set -euo pipefail
          make -C examples/b2b-escrow prepare 2>&1 | tee reports/native.log
      - name: Prove expected red AND green cases (not a release gate)
        run: make -C examples/b2b-escrow verify REPORT_DIR="$GITHUB_WORKSPACE/reports/conformance"
      - name: Strict regression against immutable Git baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          make -C examples/b2b-escrow gate GATE=regression
          BASELINE="$GITHUB_WORKSPACE/reports/baseline.evidence.json"
          REPORT_DIR="$GITHUB_WORKSPACE/reports/regression"
      - name: Strict DoD against immutable Git baseline
        # Run even if regression failed, but never use a failed/missing native build.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          make -C examples/b2b-escrow gate GATE=dod
          BASELINE="$GITHUB_WORKSPACE/reports/baseline.evidence.json"
          REPORT_DIR="$GITHUB_WORKSPACE/reports/dod"
      - name: Publish strict gate summaries
        if: always()
        shell: bash
        run: |
          for gate in regression dod; do
            report="reports/$gate/$IMPLEMENTATION/$gate/$gate.md"
            if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.implementation }}
          path: reports/
          if-no-files-found: error

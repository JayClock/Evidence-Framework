name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Desktop Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify module boundaries
        # The only check that notices a deleted constraint: it writes the imports
        # the rules must refuse and fails if a project's lint accepts one.
        run: pnpm boundaries:drill

      - name: Lint affected projects
        if: github.event_name == 'pull_request'
        run: pnpm nx affected --target=lint --base=${{ github.event.pull_request.base.sha }} --head=${{ github.event.pull_request.head.sha }}

      - name: Lint workspace
        if: github.event_name == 'push'
        run: pnpm nx run-many --target=lint --all

      - name: Typecheck workspace
        run: pnpm nx run-many --target=typecheck --all

      - name: Run tests
        run: pnpm nx run-many --target=test --all

      - name: Verify desktop build
        run: pnpm nx build desktop

name: Release Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'draft-release'

jobs:
  build-desktop:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-arm64
            os: macos-latest
            arch: arm64
          - name: macOS-x64
            os: macos-latest
            arch: x64
          - name: Windows-x64
            os: windows-latest
            arch: x64
          - name: Linux-x64
            os: ubuntu-latest
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Make Desktop App
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm nx run desktop:make -- --arch=${{ matrix.platform.arch }}

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          mkdir -p dist-release
          find apps/desktop/out/make -type f \( \
            -name "*.zip" -o \
            -name "*.exe" -o \
            -name "*.nupkg" -o \
            -name "RELEASES" -o \
            -name "*.deb" -o \
            -name "*.rpm" \
          \) -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.platform.name }}
          path: dist-release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: desktop-artifacts-*
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-artifacts

      - name: Determine tag name
        id: get_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name || 'draft-release' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

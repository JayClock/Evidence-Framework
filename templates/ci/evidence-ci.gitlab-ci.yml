# Copy/include this template from your repository. Keep all gates strict on MRs/releases.
# Assumes this pnpm workspace, with the three paths below customized for your project.
stages: [contract, acceptance]

variables:
  GIT_DEPTH: '0'
  MODEL: examples/b2b-escrow/model/b2b-escrow.evidence.json
  GENERATED: examples/b2b-escrow/generated
  BOOTSTRAP_MODEL: examples/b2b-escrow/model/b2b-escrow-v1.evidence.json
  NX_DAEMON: 'false'

.evidence-job:
  image: node:22-bookworm
  before_script:
    - npm install --global pnpm@12.16.1
    # The workspace lockfile also provisions Bruno; no global bru is needed.
    - pnpm install --frozen-lockfile
    - pnpm --filter @evidence-poc/evidence-acceptance exec bru --version
    - pnpm nx build cli

contract-and-hygiene:
  extends: .evidence-job
  stage: contract
  script:
    - pnpm api:setup
    - pnpm evidence check "$MODEL"
    - pnpm evidence export --model "$MODEL" --out "$GENERATED" --verify
    - |
      set -eu
      mkdir -p reports
      BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      if [ -n "$BASE_SHA" ] && ! printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
        git cat-file -e "${BASE_SHA}^{commit}"
        if git cat-file -e "${BASE_SHA}:${MODEL}" 2>/dev/null; then
          git show "${BASE_SHA}:${MODEL}" > reports/baseline.evidence.json
        else
          git show "${BASE_SHA}:${BOOTSTRAP_MODEL}" > reports/baseline.evidence.json
        fi
      else
        cp "$BOOTSTRAP_MODEL" reports/baseline.evidence.json
      fi
      pnpm evidence diff reports/baseline.evidence.json "$MODEL" --format markdown > reports/api-diff.md
  artifacts:
    when: always
    paths: [reports/]

.evidence-gate:
  extends: .evidence-job
  stage: acceptance
  needs:
    - job: contract-and-hygiene
      artifacts: true
  script:
    - |
      set -eu
      make -C examples/b2b-escrow prepare IMPLEMENTATION=ts-fastify
      make -C examples/b2b-escrow gate IMPLEMENTATION=ts-fastify GATE="$GATE" \
        BASELINE="$CI_PROJECT_DIR/reports/baseline.evidence.json" \
        REPORT_DIR="$CI_PROJECT_DIR/reports/$GATE"
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: reports/*/ts-fastify/*/*.xml

regression-gate:
  extends: .evidence-gate
  variables:
    GATE: regression

dod-gate:
  extends: .evidence-gate
  variables:
    GATE: dod
